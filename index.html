<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fluxo - Login</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #031016;
      --bg-teal: #1a807d;
      --bg-mid: #072a39;
      --text-main: #ffffff;
      --text-mut: #9ca3af;
      --input-border: #215e63;
      --input-border-focus: #2dd4bf;
      --input-bg: transparent;
      --btn-bg: #ffffff;
      --btn-text: #0f172a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, var(--bg-teal) 0%, var(--bg-mid) 40%, var(--bg-dark) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 40px 24px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .logo-icon svg {
      width: 24px;
      height: 24px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }
    .subtitle {
      color: var(--text-main);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 32px;
      opacity: 0.9;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      position: relative;
      width: 100%;
    }

    .input-group input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 14px;
      padding: 16px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }
    
    .input-group input::placeholder {
      color: var(--text-mut);
    }

    .input-group input:focus {
      border-color: var(--input-border-focus);
    }

    .btn-eye {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-mut);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .btn-eye:hover {
      color: var(--text-main);
    }
    .btn-eye svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 8px;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .custom-checkbox {
      width: 20px;
      height: 20px;
      border: 1.5px solid var(--text-mut);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.2s;
    }
    
    .checkbox-group input[type="checkbox"] {
      display: none;
    }

    .checkbox-group input[type="checkbox"]:checked + .custom-checkbox {
      background: var(--input-border-focus);
      border-color: var(--input-border-focus);
    }
    
    .custom-checkbox svg {
      width: 14px;
      height: 14px;
      stroke: var(--bg-dark);
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s;
    }

    .checkbox-group input[type="checkbox"]:checked + .custom-checkbox svg {
      opacity: 1;
      transform: scale(1);
    }

    .checkbox-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .checkbox-text b {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
    }
    .checkbox-text span {
      font-size: 12px;
      color: var(--text-mut);
      line-height: 1.4;
    }

    .msg-erro {
      display: none;
      color: #f87171;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .btn-submit {
      width: 100%;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn-submit:hover:not(:disabled) {
      opacity: 0.9;
      transform: scale(0.99);
    }
    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .btn-submit svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .links-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
    }
    .links-row a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .links-row a:hover {
      opacity: 0.7;
      text-decoration: underline;
    }

    .footer {
      margin-top: auto;
      padding-top: 40px;
      font-size: 12px;
      color: var(--text-mut);
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <div class="logo-icon">
      <svg viewBox="0 0 24 24">
        <path d="M4 12c2.5 0 3-4 6-4s3.5 4 6 4 3-4 6-4" />
      </svg>
    </div>

    <h1 id="titulo-topo">Fluxo</h1>
    <p class="subtitle" id="sub-topo">Entre com o seu utilizador e senha.</p>

    <form id="form-auth" onsubmit="enviarAuth(event)">
      
      <div class="input-group" id="grupo-nome" style="display:none;">
        <input type="text" id="nome-input" placeholder="Nome" autocomplete="given-name">
      </div>

      <div class="input-group" id="grupo-sobrenome" style="display:none;">
        <input type="text" id="sobrenome-input" placeholder="Sobrenome" autocomplete="family-name">
      </div>

      <div class="input-group" id="grupo-email-cad" style="display:none;">
        <input type="email" id="email-cad-input" placeholder="E-mail de contato" autocomplete="email">
      </div>

      <div class="input-group">
        <input type="text" id="username-input" placeholder="Utilizador ou E-mail" required autocomplete="username" autocapitalize="none">
      </div>

      <div class="input-group" id="grupo-codigo" style="display:none;">
        <input type="text" id="codigo-input" placeholder="Código de recuperação" autocomplete="off">
      </div>

      <div class="input-group">
        <input type="password" id="senha-input" placeholder="Senha (mín. 6 chars com 1 caractere especial)" required minlength="6" autocomplete="current-password">
        <button type="button" class="btn-eye" onclick="toggleSenha('senha-input', this)" title="Mostrar/Ocultar senha">
          <svg id="icon-senha-input" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <div class="input-group" id="grupo-senha2" style="display:none;">
        <input type="password" id="senha2-input" placeholder="Repita a senha" minlength="6" autocomplete="new-password">
        <button type="button" class="btn-eye" onclick="toggleSenha('senha2-input', this)" title="Mostrar/Ocultar senha">
          <svg id="icon-senha2-input" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <label class="checkbox-group" id="label-manter-logado">
        <input type="checkbox" id="manter-logado">
        <div class="custom-checkbox">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="checkbox-text">
          <b>Mantenha-me logado</b>
          <span>Se não marcar, a sessão expira após 30 minutos de inatividade.</span>
        </div>
      </label>

      <div id="msg-erro" class="msg-erro"></div>

      <button type="submit" class="btn-submit" id="btn-auth">
        Entrar
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>

    </form>

    <div class="links-row">
      <a id="link-modo" onclick="setModo(modo === 'entrar' ? 'cadastro' : 'entrar')">Criar conta</a>
      <a id="link-esq" onclick="setModo('reset')">Esqueci a senha</a>
    </div>

    <div class="footer">
      © 2026 Fluxo · Ruan Henrique
    </div>

  </div>

  <!-- Biblioteca Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  
  <script>
    const SUPABASE_URL = 'https://xsgblgkzeiaxirquvpai.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_yWYJb5jYgn1aBbng1-rr3w_JyHba3YC';
    const DOMINIO = 'fluxo.com';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const key = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    let modo = 'entrar';

    // Verifica se veio de um logout explícito para limpar os dados e evitar loops
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('logout') === 'true') {
      db.auth.signOut();
      localStorage.clear();
    } else {
      // Se já estiver logado, redireciona pro menu
      db.auth.getSession().then(({ data }) => {
        if (data && data.session) {
          window.location.href = 'menu.html';
        }
      });
    }

    function toggleSenha(idInput, btn) {
      const input = document.getElementById(idInput), svg = document.getElementById('icon-' + idInput);
      if (input.type === 'password') {
        input.type = 'text';
        svg.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
      } else {
        input.type = 'password';
        svg.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
      }
    }

    function setModo(m) {
      modo = m;
      const cad = (m === 'cadastro'), rst = (m === 'reset');

      document.getElementById('grupo-nome').style.display = cad ? 'block' : 'none';
      document.getElementById('grupo-sobrenome').style.display = cad ? 'block' : 'none';
      document.getElementById('grupo-email-cad').style.display = cad ? 'block' : 'none';
      document.getElementById('grupo-senha2').style.display = (cad || rst) ? 'block' : 'none';
      document.getElementById('grupo-codigo').style.display = rst ? 'block' : 'none';
      document.getElementById('label-manter-logado').style.display = m === 'entrar' ? 'flex' : 'none';

      document.getElementById('nome-input').required = cad;
      document.getElementById('sobrenome-input').required = cad;
      document.getElementById('email-cad-input').required = cad;
      document.getElementById('senha2-input').required = (cad || rst);
      document.getElementById('codigo-input').required = rst;

      document.getElementById('senha-input').placeholder = rst ? 'Nova senha (mín. 6 chars com 1 caractere especial)' : 'Senha (mínimo 6 caracteres)';
      document.getElementById('btn-auth').innerHTML = (cad ? 'Criar Conta' : rst ? 'Redefinir Senha' : 'Entrar') + ` <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
      document.getElementById('link-modo').textContent = m === 'entrar' ? 'Criar conta' : 'Já tenho conta';
      document.getElementById('link-esq').style.display = m === 'entrar' ? 'block' : 'none';
      document.getElementById('sub-topo').textContent = cad ? 'Preencha os dados de cadastro.' : rst ? 'Informe o utilizador, o código e a nova senha.' : 'Entre com o seu utilizador e senha.';
      
      document.getElementById('msg-erro').style.display = 'none';
    }

    function mostrarErro(msg) {
      const el = document.getElementById('msg-erro');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function enviarAuth(e) {
      e.preventDefault();
      const msgErro = document.getElementById('msg-erro');
      msgErro.style.display = 'none';

      const inputVal = document.getElementById('username-input').value.trim();
      const email = inputVal.includes('@') ? inputVal : (key(inputVal) + '@' + DOMINIO);
      const u = key(inputVal.split('@')[0]);
      const s = document.getElementById('senha-input').value;

      if (!/^[a-z0-9._-]{3,30}$/.test(u)) {
        return mostrarErro('Utilizador: 3 a 30 caracteres válidos.');
      }
      if (s.length < 6) {
        return mostrarErro('A senha precisa ter ao menos 6 caracteres.');
      }
      const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>\-_+=~`[\]\\/|;']/.test(s);
      if (!hasSpecialChar) {
        return mostrarErro('A senha deve conter pelo menos um caractere especial (ex: !, @, #, $, etc.).');
      }

      if (modo === 'cadastro' && s !== document.getElementById('senha2-input').value) {
        return mostrarErro('As senhas não coincidem.');
      }

      const btnAuth = document.getElementById('btn-auth');
      btnAuth.disabled = true;
      btnAuth.textContent = 'Processando...';

      if (modo === 'reset') {
        const { data: ok, error: er } = await db.rpc('redefinir_senha', { p_usuario: u, p_codigo: document.getElementById('codigo-input').value, p_nova: s });
        if (er || !ok) {
          btnAuth.disabled = false;
          btnAuth.innerHTML = `Redefinir Senha <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
          return mostrarErro('Utilizador ou código de recuperação incorreto.');
        }
      }

      const isCadastro = (modo === 'cadastro');
      const metadata = isCadastro ? { 
        usuario: u, 
        nome: document.getElementById('nome-input').value.trim(), 
        sobrenome: document.getElementById('sobrenome-input').value.trim(), 
        email_contato: document.getElementById('email-cad-input').value.trim()
      } : { usuario: u };

      const { data, error } = isCadastro
        ? await db.auth.signUp({ email, password: s, options: { data: metadata } })
        : await db.auth.signInWithPassword({ email, password: s });
        
      btnAuth.disabled = false;
      if (error) {
        btnAuth.innerHTML = `Entrar <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
        const m = error.message.toLowerCase();
        return mostrarErro(m.includes('already') ? 'Esse e-mail ou utilizador já existe.' : m.includes('invalid login') ? 'Utilizador ou senha incorretos.' : 'Erro: ' + error.message);
      }
      
      if (!data.session) {
        return mostrarErro('Conta criada! Faça login com suas credenciais.');
      }

      const manterLogado = document.getElementById('manter-logado').checked;
      if (!manterLogado && modo === 'entrar') {
        localStorage.setItem('fluxo_expirar_inatividade', 'true');
      } else {
        localStorage.removeItem('fluxo_expirar_inatividade');
      }

      if (isCadastro) {
        window.location.href = 'perfil.html';
      } else if (modo === 'reset') {
        window.location.href = 'perfil.html#recuperacao';
      } else {
        window.location.href = 'menu.html';
      }
    }
  </script>
</body>
</html>
