  <link rel="manifest" href="manifest.json">

  <script>
  (function () {
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var ACENTOS = /^(teal|blue|purple|red|orange|pink|green)$/;
    var FUNDOS = /^(padrao|eclipse|ocean|scarlet|amethyst|volcano)$/;
    function ler(k, pad) { try { return localStorage.getItem(k) || pad; } catch (e) { return pad; } }
    function modo() { var m = ler('fluxo_tema', 'auto'); return (m === 'light' || m === 'dark') ? m : 'auto'; }
    function accent() { var a = ler('fluxo_accent', 'teal'); return ACENTOS.test(a) ? a : 'teal'; }
    function fonte() { var f = ler('fluxo_fonte', ''); return (f === 'preto' || f === 'branco') ? f : ''; }
    function fundo() { var b = ler('fluxo_fundo', 'padrao'); return FUNDOS.test(b) ? b : 'padrao'; }
    function aplicar() {
      var m = modo(), t = m === 'auto' ? (mq && mq.matches ? 'dark' : 'light') : m;
      var ac = accent(), fo = fonte(), bg = fundo();
      var h = document.documentElement;
      h.setAttribute('data-theme', t);
      h.setAttribute('data-accent', ac);
      if (t === 'dark') h.setAttribute('data-bg', bg); else h.removeAttribute('data-bg');
      if (fo) h.setAttribute('data-fonte', fo); else h.removeAttribute('data-fonte');
    }
    aplicar();
    document.addEventListener('DOMContentLoaded', aplicar);
    window.addEventListener('storage', function (e) { if (e.key && /^fluxo_(tema|accent|fonte|fundo)$/.test(e.key)) aplicar(); });
    if (mq && mq.addEventListener) mq.addEventListener('change', aplicar);
  })();
  </script>

  <style>

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  .e-azul { background: #3b82f6; } .e-verde { background: #16a34a; } .e-roxo { background: #8b5cf6; } .e-laranja { background: #ea580c; } .e-rosa { background: #db2777; } .e-cinza { background: #64748b; }
  .mais { pointer-events: auto; border: 0; background: none; color: var(--mut); font-weight: 700; font-size: 11.5px; text-align: left; padding: 0 8px; height: 22px; }

  /* aba Hoje */
  .hoje-v { max-width: 760px; margin: 0 auto; padding: 18px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
  .h-card { background: var(--bg); border: 1px solid var(--bd); border-radius: 16px; padding: 14px 16px; }

  .pill-st { display: inline-block; padding: 3px 10px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 800; }

    .lin { grid-template-columns: 1fr; }
  }
  </style>
</head>

const isoHoje = () => isoDe(new Date());
const parseIso = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const somaDias = (iso, n) => { const d = parseIso(iso); d.setDate(d.getDate() + n); return isoDe(d); };
const diasEntre = (a, b) => Math.round((parseIso(b) - parseIso(a)) / 86400000);
const dtBR = iso => iso.split('-').reverse().join('/');
const inicioSemana = iso => somaDias(iso, -parseIso(iso).getDay());

/* ---------- regras das FAAs (as mesmas do menu) ---------- */
const PRAZO_DIAS = 20;
const ehUrgente = r => Number(r.prazo_urgente) >= 1 && Number(r.prazo_urgente) <= 3;
const prazoDe = r => ehUrgente(r) ? Number(r.prazo_urgente) : PRAZO_DIAS;
const baseDe = r => (ehUrgente(r) && r.urgente_desde) ? r.urgente_desde : r.data;
function statusDe(r) {
  if (r.status === 'concluido') return 'concluido';
  if (diasEntre(baseDe(r), isoHoje()) > prazoDe(r)) return 'atrasado';
  if (ehUrgente(r)) return 'urgente';
  return r.status === 'executando' ? 'executando' : 'pendente';
}
const ST_ROT = { pendente: 'Pendente (no prazo)', executando: 'Executando', atrasado: 'Atrasada', concluido: 'Concluída', urgente: 'Jurídico / Urgente' };
const COR_ST = { pendente: '#f59e0b', executando: '#f59e0b', atrasado: '#dc2626', concluido: '#2563eb', urgente: '#dc2626' };
const COLS_BASE = 'id, user_id, data, categoria, responsavel, descricao, detalhe, status, executor, executor_id, iniciado_em, concluido_em';
let COLS = COLS_BASE + ', prazo_urgente, urgente_desde';

function periodo(r) {
  const ini = baseDe(r), venc = somaDias(ini, prazoDe(r));
  let fim = venc;
  if (r.status === 'concluido' && r.concluido_em) { const c = isoDe(new Date(r.concluido_em)); fim = c < ini ? ini : c; }
  else if (r.status !== 'concluido' && isoHoje() > venc) fim = isoHoje();   // atrasada: segue até hoje
  return { ini, fim, venc };
}

/* ---------- feriados nacionais (fixos + móveis) ---------- */
const FER_CACHE = {};
function pascoa(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mes - 1, dia);
}
function feriadosDe(y) {
  if (FER_CACHE[y]) return FER_CACHE[y];
  const m = {}, fx = [['01-01', 'Confraternização Universal'], ['04-21', 'Tiradentes'], ['05-01', 'Dia do Trabalho'], ['09-07', 'Independência do Brasil'], ['10-12', 'Nossa Senhora Aparecida'], ['11-02', 'Finados'], ['11-15', 'Proclamação da República'], ['11-20', 'Dia da Consciência Negra'], ['12-25', 'Natal']];
  fx.forEach(([md, n]) => { m[y + '-' + md] = n; });
  const p = isoDe(pascoa(y));
  m[somaDias(p, -47)] = 'Carnaval'; m[somaDias(p, -2)] = 'Sexta-feira Santa'; m[p] = 'Páscoa'; m[somaDias(p, 60)] = 'Corpus Christi';
  return (FER_CACHE[y] = m);
}
const feriadoDe = iso => feriadosDe(Number(iso.slice(0, 4)))[iso] || '';

/* ---------- estado ---------- */
let uid = null, EU = {}, PESSOAS = [], REL = [], EVT = [], ESC = [], SQL_CAL_OK = true, ITENS = {}, evJanela = '';
const CFG_PAD = { faa: true, conc: false, esc: true, ev: true, fer: true, off: {} };
let CFG = (() => { try { return Object.assign({}, CFG_PAD, JSON.parse(localStorage.getItem('fluxo_cal_cfg') || '{}')); } catch (e) { return Object.assign({}, CFG_PAD); } })();
const salvarCfg = () => { try { localStorage.setItem('fluxo_cal_cfg', JSON.stringify(CFG)); } catch (e) {} };
const S = { vista: 'mes', ref: isoHoje(), sel: isoHoje(), mini: isoHoje() };
{ const q = new URLSearchParams(location.search).get('v'); if (q === 'hoje' || q === 'semana' || q === 'mes') S.vista = q; }

const CORES_PESSOA = ['#8b5cf6', '#ea580c', '#db2777', '#0ea5e9', '#16a34a', '#ca8a04', '#64748b', '#e11d48'];
const corPessoa = id => { const i = PESSOAS.filter(p => !p.eu).findIndex(p => p.user_id === id); return CORES_PESSOA[(i < 0 ? 0 : i) % CORES_PESSOA.length]; };
const pessoaPorId = id => PESSOAS.find(p => p.user_id === id) || null;
const primeiroNome = p => String((p && (p.nome || p.usuario)) || '').trim().split(/\s+/)[0] || '';
function donoNome(r) {
  if (r.user_id === uid) return 'Você';
  const p = pessoaPorId(r.user_id); if (p) return p.nome || p.usuario;
  return r.responsavel || 'Outra pessoa';
}
const donoVisivel = id => id === uid || CFG.off[id] !== true;

function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { el.hidden = true; }, 3200); }

/* ---------- janela visível ---------- */
function janela() {
  if (S.vista === 'hoje') return { ini: S.sel, fim: S.sel };
  if (S.vista === 'semana') { const i = inicioSemana(S.ref); return { ini: i, fim: somaDias(i, 6) }; }
  const d = parseIso(S.ref), p = isoDe(new Date(d.getFullYear(), d.getMonth(), 1)), u = isoDe(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  return { ini: inicioSemana(p), fim: somaDias(inicioSemana(u), 6) };
}

/* ---------- itens (FAAs, escala, eventos, feriados) ---------- */
function montarItens(ini, fim) {
  const lista = []; ITENS = {}; let n = 0;
  const add = it => { it.key = 'i' + (n++); ITENS[it.key] = it; lista.push(it); };
  const hoje = isoHoje();

  if (CFG.fer) {
    for (let d = ini; d <= fim; d = somaDias(d, 1)) { const f = feriadoDe(d); if (f) add({ tipo: 'fer', ini: d, fim: d, titulo: f, cls: 'c-fer', ord: 0 }); }
  }
  if (CFG.esc && ESC.length && hoje >= ini && hoje <= fim) {
    add({ tipo: 'esc', ini: hoje, fim: hoje, titulo: 'Escala · ' + ESC.length + (ESC.length === 1 ? ' pessoa' : ' pessoas'), cls: 'c-esc', ord: 1 });
  }
  if (CFG.faa) {
    REL.forEach(r => {
      if (r.categoria !== 'faa' || !donoVisivel(r.user_id)) return;
      const sk = statusDe(r); if (sk === 'concluido' && !CFG.conc) return;
      const p = periodo(r); if (p.ini > fim || p.fim < ini) return;
      const cls = sk === 'concluido' ? 'c-azul conc' : (ehUrgente(r) ? 'c-urg' : (sk === 'atrasado' ? 'c-vermelha' : 'c-amarela'));
      add({ tipo: 'faa', r, sk, p, ini: p.ini, fim: p.fim, titulo: (r.user_id === uid ? '' : primeiroNome({ nome: donoNome(r) }) + ' · ') + r.descricao, cls, ord: 3 });
    });
  }
  if (CFG.ev) {
    EVT.forEach(e => {
      if (!e.meu && !donoVisivel(e.dono_id)) return;
      if (e.inicio > fim || e.fim < ini) return;
      const dono = e.meu ? null : pessoaPorId(e.dono_id);
      add({ tipo: 'ev', e, ini: e.inicio, fim: e.fim, titulo: (e.hora_ini ? e.hora_ini + ' ' : '') + (dono ? primeiroNome(dono) + ': ' : '') + e.titulo, cls: 'e-' + e.cor, ord: 2 });
    });
  }
  return lista;
}

/* ---------- grade (mês/semana) ---------- */
function semanaHTML(d0, itens, maxLanes, refMes) {
  const dias = Array.from({ length: 7 }, (_, i) => somaDias(d0, i)), d6 = dias[6];
  const segs = itens.filter(it => it.ini <= d6 && it.fim >= d0).map(it => ({ it, c0: Math.max(0, diasEntre(d0, it.ini)), c1: Math.min(6, diasEntre(d0, it.fim)), ci: it.ini < d0, cf: it.fim > d6 }));
  segs.sort((a, b) => a.c0 - b.c0 || (b.c1 - b.c0) - (a.c1 - a.c0) || a.it.ord - b.it.ord || a.it.ini.localeCompare(b.it.ini));
  const busy = [], oculto = Array(7).fill(0); let usadas = 0;
  segs.forEach(s => {
    let l = 0; while (busy[l] && busy[l].slice(s.c0, s.c1 + 1).some(Boolean)) l++;
    busy[l] = busy[l] || Array(7).fill(false); for (let c = s.c0; c <= s.c1; c++) busy[l][c] = true; s.l = l;
    if (l < maxLanes) usadas = Math.max(usadas, l + 1); else for (let c = s.c0; c <= s.c1; c++) oculto[c]++;
  });
  const temMais = oculto.some(Boolean), linhas = usadas + (temMais ? 1 : 0), hoje = isoHoje();
  let h = '<div class="sem"><div class="dias" style="--ln:' + linhas + '">';
  dias.forEach(d => {
    const dt = parseIso(d), rot = dt.getDate() === 1 ? dt.getDate() + ' ' + MES_CURTO[dt.getMonth()] : dt.getDate();
    h += '<div class="dia' + (refMes != null && dt.getMonth() !== refMes ? ' fora' : '') + (d === hoje ? ' hoje' : '') + (d === S.sel ? ' sel' : '') + '" data-d="' + d + '"><button type="button" class="dnum" data-d="' + d + '" title="Ver o dia">' + rot + '</button></div>';
  });
  h += '</div><div class="barras">';
  segs.filter(s => s.l < maxLanes).forEach(s => {
    h += '<button type="button" class="chip ' + s.it.cls + (s.ci ? ' ci' : '') + (s.cf ? ' cf' : '') + '" style="grid-row:' + (s.l + 1) + ';grid-column:' + (s.c0 + 1) + '/' + (s.c1 + 2) + '" data-k="' + s.it.key + '" title="' + esc(s.it.titulo) + '">' + esc(s.it.titulo) + '</button>';
  });
  oculto.forEach((n, c) => { if (n) h += '<button type="button" class="mais" style="grid-row:' + (usadas + 1) + ';grid-column:' + (c + 1) + '" data-d="' + dias[c] + '">+' + n + ' mais</button>'; });
  return h + '</div></div>';
}

function renderGrade() {
  const w = janela(), itens = montarItens(w.ini, w.fim), mobile = window.innerWidth <= 860;
  let h = '<div class="cab-sem">' + DIAS_CAB.map(n => '<div>' + n + '</div>').join('') + '</div>';
  if (S.vista === 'semana') h += semanaHTML(w.ini, itens, 99, null);
  else {
    const refMes = parseIso(S.ref).getMonth(), max = mobile ? 3 : 4;
    for (let d = w.ini; d <= w.fim; d = somaDias(d, 7)) h += semanaHTML(d, itens, max, refMes);
  }
  $('vista').className = 'vista ' + S.vista; $('vista').innerHTML = h;
}

/* ---------- aba Hoje (dia) ---------- */
function renderDia() {
  const d = S.sel, hoje = isoHoje(), dt = parseIso(d), ehHoje = d === hoje;
  const w = { ini: d, fim: d }, itens = montarItens(w.ini, w.fim);
  const fer = feriadoDe(d);
  let h = '<div class="hoje-v">';
  h += '<div style="font-size:13px;color:var(--mut);font-weight:700">' + (ehHoje ? 'HOJE' : (d < hoje ? 'DIA PASSADO' : 'DIA FUTURO')) + '</div>';
  if (fer) h += '<div class="h-card"><div class="h-item"><span class="h-dot" style="background:#3f8f5b"></span><div class="h-tx"><b>' + esc(fer) + '</b><small>Feriado nacional</small></div></div></div>';

  if (CFG.esc) {
    h += '<div class="h-card"><h3>Escala<a class="btn-o" href="escala.html" style="text-decoration:none;color:inherit">Editar escala</a></h3>';
    if (!ehHoje) h += '<p class="h-vazio">Por enquanto a escala só aparece aqui para o dia de hoje.</p>';
    else if (!ESC.length) h += '<p class="h-vazio">Nenhuma escala montada para hoje.</p>';
    else h += '<div class="h-esc">' + ESC.map(x => {
      const nome = x.nome || x.usuario, it = String(x.tarefas || '').split(/[\n;,]+/).map(t => t.trim()).filter(Boolean).map(t => t.charAt(0).toUpperCase() + t.slice(1));
      return '<div class="h-pes' + (x.eu ? ' eu' : '') + '"><b>' + esc(x.eu ? nome + ' (você)' : nome) + '</b><small>' + esc(x.semana_nome || ('Semana ' + x.semana_numero)) + (x.convidado ? ' · convidado' : '') + '</small>' +
        (it.length ? '<ol>' + it.map(t => '<li>' + esc(t) + '</li>').join('') + '</ol>' : '<div style="margin-top:8px"><i>Sem função hoje</i></div>') + '</div>';
    }).join('') + '</div>';
    h += '</div>';
  }

  if (CFG.faa) {
    const fa = itens.filter(i => i.tipo === 'faa').sort((a, b) => ({ atrasado: 0, urgente: 1, executando: 2, pendente: 3, concluido: 4 }[a.sk] - { atrasado: 0, urgente: 1, executando: 2, pendente: 3, concluido: 4 }[b.sk]) || a.p.venc.localeCompare(b.p.venc));
    h += '<div class="h-card"><h3>FAAs com prazo neste dia <span style="font-weight:600;color:var(--mut);font-size:12.5px">' + fa.length + '</span></h3>';
    h += fa.length ? fa.map(i => {
      const rest = diasEntre(d, i.p.venc), txt = i.sk === 'concluido' ? 'Concluída' : (rest < 0 ? 'venceu há ' + (-rest) + (rest === -1 ? ' dia' : ' dias') : rest === 0 ? 'vence neste dia' : 'vence em ' + rest + (rest === 1 ? ' dia' : ' dias'));
      return '<button type="button" class="h-item" data-k="' + i.key + '"><span class="h-dot" style="background:' + COR_ST[i.sk] + '"></span><span class="h-tx"><b>' + esc(i.r.descricao) + '</b><small>' + esc(donoNome(i.r)) + ' · pedida ' + dtBR(i.p.ini) + ' · ' + txt + '</small></span></button>';
    }).join('') : '<p class="h-vazio">Nenhuma FAA neste dia.</p>';
    h += '</div>';
  }

  if (CFG.ev) {
    const ev = itens.filter(i => i.tipo === 'ev').sort((a, b) => String(a.e.hora_ini || '').localeCompare(String(b.e.hora_ini || '')));
    h += '<div class="h-card"><h3>Eventos<button type="button" class="btn-o" id="btn-ev-dia">+ Evento neste dia</button></h3>';
    h += ev.length ? ev.map(i => {
      const e = i.e, dono = e.meu ? 'Você' : (pessoaPorId(e.dono_id) ? (pessoaPorId(e.dono_id).nome || pessoaPorId(e.dono_id).usuario) : 'Alguém');
      return '<button type="button" class="h-item" data-k="' + i.key + '"><span class="h-dot ' + 'e-' + e.cor + '"></span><span class="h-tx"><b>' + esc(e.titulo) + '</b><small>' + (e.hora_ini ? e.hora_ini + (e.hora_fim ? '–' + e.hora_fim : '') + ' · ' : '') + esc(dono) + (e.inicio !== e.fim ? ' · ' + dtBR(e.inicio) + ' a ' + dtBR(e.fim) : '') + '</small></span></button>';
    }).join('') : '<p class="h-vazio">Nenhum evento neste dia.</p>';
    h += '</div>';
  }
  $('vista').className = 'vista hoje'; $('vista').innerHTML = h + '</div>';
}

/* ---------- barra lateral ---------- */
function renderMini() {
  const d = parseIso(S.mini), ano = d.getFullYear(), mes = d.getMonth(), hoje = isoHoje();
  $('mini-tit').textContent = MESES[mes].charAt(0).toUpperCase() + MESES[mes].slice(1) + ' de ' + ano;
  const p = isoDe(new Date(ano, mes, 1)), i0 = inicioSemana(p);
  let h = 'DSTQQSS'.split('').map(c => '<div class="dw">' + c + '</div>').join('');
  for (let k = 0; k < 42; k++) {
    const iso = somaDias(i0, k), dt = parseIso(iso);
    h += '<button type="button" data-d="' + iso + '" class="' + (dt.getMonth() !== mes ? 'fora ' : '') + (iso === hoje ? 'hoje ' : '') + (iso === S.sel && iso !== hoje ? 'sel' : '') + '">' + dt.getDate() + '</button>';
  }
  $('mini-g').innerHTML = h;
}

function renderLateral() {
  document.querySelectorAll('#side [data-c]').forEach(i => { i.checked = !!CFG[i.dataset.c]; });
  const outras = PESSOAS.filter(p => !p.eu);
  let h = '';
  if (!SQL_CAL_OK) h = '<small>As agendas das pessoas ainda não estão ativas.</small>';
  else if (!outras.length) h = '<small>Ninguém aceitou ainda. <a href="perfil.html#pessoas">Adicionar pessoas</a></small>';
  else h = outras.map(p => {
    const f = fotoOk(p.foto), n = p.nome || p.usuario;
    return '<label class="ck" style="--ck:' + corPessoa(p.user_id) + '"><input type="checkbox" data-p="' + esc(p.user_id) + '"' + (CFG.off[p.user_id] === true ? '' : ' checked') + '><span class="av">' + (f ? '<img src="' + esc(f) + '" alt="">' : esc(n.trim().charAt(0).toUpperCase())) + '</span><span class="n">' + esc(n) + '</span></label>';
  }).join('') + '<small>Mostra as FAAs e os eventos partilhados de cada pessoa.</small>';
  $('outras').innerHTML = h;
}

function titulo() {
  const d = parseIso(S.ref);
  if (S.vista === 'mes') return MESES[d.getMonth()] + ' de ' + d.getFullYear();
  if (S.vista === 'semana') { const a = parseIso(inicioSemana(S.ref)), b = parseIso(somaDias(inicioSemana(S.ref), 6)); return a.getMonth() === b.getMonth() ? a.getDate() + ' – ' + b.getDate() + ' de ' + MESES[b.getMonth()] + ' de ' + b.getFullYear() : a.getDate() + ' ' + MES_CURTO[a.getMonth()] + ' – ' + b.getDate() + ' ' + MES_CURTO[b.getMonth()] + ' ' + b.getFullYear(); }
  const s = parseIso(S.sel); return DIAS_LONGO[s.getDay()] + ', ' + s.getDate() + ' de ' + MESES[s.getMonth()] + ' de ' + s.getFullYear();
}

function render() {
  $('titulo').textContent = titulo();
  document.querySelectorAll('#abas button').forEach(b => b.classList.toggle('on', b.dataset.v === S.vista));
  if (S.vista === 'hoje') renderDia(); else renderGrade();
  renderMini(); renderLateral();
  const w = janela(), chave = w.ini + '|' + w.fim;
  if (chave !== evJanela) carregarEventos().then(() => { if (evJanela === chave) render2(); });
}
function render2() { if (S.vista === 'hoje') renderDia(); else renderGrade(); renderLateral(); }

/* ---------- dados ---------- */
async function carregarRel() {
  let { data, error } = await db.from('relatorio').select(COLS).order('id', { ascending: false }).limit(500);
  if (error && /prazo_urgente|urgente_desde/.test(error.message || '')) { COLS = COLS_BASE; ({ data, error } = await db.from('relatorio').select(COLS).order('id', { ascending: false }).limit(500)); }
  if (!error) REL = data || [];
}
async function carregarEscala() {
  const { data, error } = await db.rpc('escala_hoje');
  ESC = (!error && Array.isArray(data)) ? data : [];
}
async function carregarPessoas() {
  const { data, error } = await db.rpc('cal_pessoas');
  if (error) { SQL_CAL_OK = false; PESSOAS = []; return; }
  PESSOAS = Array.isArray(data) ? data : [];
  const eu = PESSOAS.find(p => p.eu); if (eu) EU = eu;
}
async function carregarEventos() {
  const w = janela(); evJanela = w.ini + '|' + w.fim;
  const { data, error } = await db.rpc('cal_eventos', { p_ini: w.ini, p_fim: w.fim });
  if (error) { SQL_CAL_OK = false; EVT = []; }
  else { SQL_CAL_OK = true; EVT = Array.isArray(data) ? data : []; }
  const av = $('aviso-sql'); av.hidden = SQL_CAL_OK;
  if (!SQL_CAL_OK) av.innerHTML = 'Para ativar o calendário geral partilhado e as agendas das pessoas, rode o arquivo <b>banco_de_dado_calendario.txt</b> no SQL Editor do Supabase. As FAAs, a escala e os feriados já funcionam.';
}
async function recarregarTudo() {
  await Promise.all([carregarRel(), carregarEscala(), carregarPessoas()]);
  await carregarEventos();
  render2(); renderMini();
}

/* ---------- navegação ---------- */
function mover(n) {
  if (S.vista === 'mes') { const d = parseIso(S.ref); S.ref = isoDe(new Date(d.getFullYear(), d.getMonth() + n, 1)); }
  else if (S.vista === 'semana') S.ref = somaDias(S.ref, 7 * n);
  else { S.sel = somaDias(S.sel, n); S.ref = S.sel; }
  S.mini = S.ref; render();
}
function irPara(iso, vista) { S.ref = iso; S.sel = iso; S.mini = iso; if (vista) S.vista = vista; render(); }
$('btn-hoje').onclick = () => irPara(isoHoje());
$('btn-ant').onclick = () => mover(-1);
$('btn-prox').onclick = () => mover(1);
$('abas').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; S.vista = b.dataset.v; if (S.vista !== 'mes') S.ref = S.sel; render(); };
$('mini-ant').onclick = () => { const d = parseIso(S.mini); S.mini = isoDe(new Date(d.getFullYear(), d.getMonth() - 1, 1)); renderMini(); };
$('mini-prox').onclick = () => { const d = parseIso(S.mini); S.mini = isoDe(new Date(d.getFullYear(), d.getMonth() + 1, 1)); renderMini(); };
$('mini-g').onclick = e => { const b = e.target.closest('[data-d]'); if (!b) return; irPara(b.dataset.d); fecharSide(); };
$('btn-menu').onclick = () => $('side').classList.add('aberto');
const fecharSide = () => $('side').classList.remove('aberto');
document.addEventListener('click', e => { if ($('side').classList.contains('aberto') && !e.target.closest('#side') && !e.target.closest('#btn-menu')) fecharSide(); });

$('side').addEventListener('change', e => {
  const c = e.target.dataset.c, p = e.target.dataset.p;
  if (c) CFG[c] = e.target.checked;
  if (p) { if (e.target.checked) delete CFG.off[p]; else CFG.off[p] = true; }
  salvarCfg(); render2();
});

$('vista').addEventListener('click', e => {
  const k = e.target.closest('[data-k]');
  if (k) return abrirItem(ITENS[k.dataset.k]);
  const d = e.target.closest('[data-d]');
  if (d) {
    if (d.classList.contains('dnum') || d.classList.contains('mais')) return irPara(d.dataset.d, 'hoje');
    S.sel = d.dataset.d; document.querySelectorAll('.dia.sel').forEach(x => x.classList.remove('sel')); d.classList.add('sel'); renderMini();
  }
  if (e.target.id === 'btn-ev-dia') abrirForm(null, S.sel);
});
$('btn-criar').onclick = () => { abrirForm(null, S.sel); fecharSide(); };

/* ---------- modais ---------- */
function abrirModal(html) {
  $('modal-box').innerHTML = '<div class="fundo-m" id="fundo-m"><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>';
  $('fundo-m').addEventListener('mousedown', e => { if (e.target.id === 'fundo-m') fecharModal(); });
}
function fecharModal() { $('modal-box').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

function abrirItem(it) {
  if (!it) return;
  if (it.tipo === 'esc') return irPara(isoHoje(), 'hoje');
  if (it.tipo === 'fer') return;
  if (it.tipo === 'ev') return it.e.meu ? abrirForm(it.e) : abrirEvento(it.e);
  const r = it.r, p = it.p, rest = diasEntre(isoHoje(), p.venc);
  const txt = it.sk === 'concluido' ? 'Concluída' + (r.concluido_em ? ' em ' + dtBR(isoDe(new Date(r.concluido_em))) : '') : (rest < 0 ? 'venceu há ' + (-rest) + (rest === -1 ? ' dia' : ' dias') : rest === 0 ? 'vence hoje' : 'vence em ' + rest + (rest === 1 ? ' dia' : ' dias'));
  abrirModal('<h3>' + esc(r.descricao) + '</h3><div class="m-info"><p><span class="pill-st" style="background:' + COR_ST[it.sk] + '">' + esc(ST_ROT[it.sk]) + '</span></p>' +
    '<p><b>Pessoa:</b> ' + esc(donoNome(r)) + '</p>' + (r.responsavel && r.user_id === uid ? '<p><b>Responsável:</b> ' + esc(r.responsavel) + '</p>' : '') +
    (r.executor ? '<p><b>Executando:</b> ' + esc(r.executor) + '</p>' : '') +
    '<p><b>Pedida em:</b> ' + dtBR(p.ini) + '</p><p><b>Prazo (vencimento):</b> ' + dtBR(p.venc) + ' <small>· ' + txt + '</small></p>' +
    (r.detalhe ? '<p><b>Detalhe:</b> ' + esc(r.detalhe) + '</p>' : '') + '</div>' +
    '<div class="m-acoes"><button type="button" class="btn-o" onclick="fecharModal()">Fechar</button><a class="btn-p" style="text-decoration:none" href="menu.html?faa=' + encodeURIComponent(r.id) + '">Abrir no painel</a></div>');
}

function abrirEvento(e) {
  const p = pessoaPorId(e.dono_id), quem = p ? (p.nome || p.usuario) : 'Alguém';
  abrirModal('<h3>' + esc(e.titulo) + '</h3><div class="m-info"><p><span class="pill-st e-' + e.cor + '">Partilhado por ' + esc(quem) + '</span></p>' +
    '<p><b>Quando:</b> ' + dtBR(e.inicio) + (e.fim !== e.inicio ? ' a ' + dtBR(e.fim) : '') + (e.hora_ini ? ' · ' + e.hora_ini + (e.hora_fim ? '–' + e.hora_fim : '') : '') + '</p>' +
    (e.descricao ? '<p>' + esc(e.descricao).replace(/\n/g, '<br>') + '</p>' : '') + '</div>' +
    '<div class="m-acoes"><button type="button" class="btn-o" onclick="fecharModal()">Fechar</button></div>');
}

let EV_COR = 'azul';
function abrirForm(e, dia) {
  const novo = !e, ini = novo ? (dia || isoHoje()) : e.inicio;
  EV_COR = novo ? 'azul' : e.cor;
  abrirModal('<h3>' + (novo ? 'Novo evento' : 'Editar evento') + '</h3>' +
    '<label for="ev-titulo">Título</label><input type="text" id="ev-titulo" maxlength="120" placeholder="Ex.: Reunião, folga, consulta..." value="' + esc(novo ? '' : e.titulo) + '">' +
    '<div class="lin"><div><label for="ev-ini">Início</label><input type="date" id="ev-ini" value="' + ini + '"></div><div><label for="ev-fim">Fim</label><input type="date" id="ev-fim" value="' + (novo ? ini : e.fim) + '"></div></div>' +
    '<div class="lin"><div><label for="ev-hi">Hora início (opcional)</label><input type="time" id="ev-hi" value="' + (novo ? '' : (e.hora_ini || '')) + '"></div><div><label for="ev-hf">Hora fim (opcional)</label><input type="time" id="ev-hf" value="' + (novo ? '' : (e.hora_fim || '')) + '"></div></div>' +
    '<label>Cor</label><div class="cores" id="ev-cores">' + ['azul', 'verde', 'roxo', 'laranja', 'rosa', 'cinza'].map(c => '<button type="button" class="e-' + c + (c === EV_COR ? ' on' : '') + '" data-c="' + c + '" aria-label="' + c + '"></button>').join('') + '</div>' +
    '<label for="ev-desc">Descrição</label><textarea id="ev-desc" rows="3" maxlength="2000">' + esc(novo ? '' : (e.descricao || '')) + '</textarea>' +
    '<label class="chk"><input type="checkbox" id="ev-part"' + (novo || e.partilhado ? ' checked' : '') + '><span>Partilhar com as minhas pessoas (quem aceitou o seu pedido vê este evento)</span></label>' +
    '<p class="m-msg" id="ev-msg"></p>' +
    '<div class="m-acoes">' + (novo ? '' : '<button type="button" class="btn-pe grow" id="ev-apagar">Apagar</button>') + '<button type="button" class="btn-o" onclick="fecharModal()">Cancelar</button><button type="button" class="btn-p" id="ev-salvar">Salvar</button></div>');
  $('ev-cores').onclick = x => { const b = x.target.closest('[data-c]'); if (!b) return; EV_COR = b.dataset.c; document.querySelectorAll('#ev-cores button').forEach(y => y.classList.toggle('on', y === b)); };
  $('ev-ini').onchange = () => { if ($('ev-fim').value < $('ev-ini').value) $('ev-fim').value = $('ev-ini').value; };
  $('ev-salvar').onclick = () => salvarEvento(novo ? null : e.id);
  if (!novo) $('ev-apagar').onclick = () => apagarEvento(e.id);
  setTimeout(() => $('ev-titulo').focus(), 30);
}

const ERROS_EV = { titulo: 'Escreva um título (até 120 letras).', datas: 'Confira as datas: o fim não pode ser antes do início (máx. 1 ano).', hora: 'Hora inválida.', descricao: 'Descrição muito longa.', limite: 'Limite de eventos atingido.', nao_encontrado: 'Esse evento não existe mais.', sem_permissao: 'Sessão inválida. Entre de novo.' };
async function salvarEvento(id) {
  const msg = $('ev-msg'), t = $('ev-titulo').value.trim(), ini = $('ev-ini').value, fim = $('ev-fim').value || ini;
  if (!t) { msg.textContent = ERROS_EV.titulo; return; }
  if (!ini || fim < ini) { msg.textContent = ERROS_EV.datas; return; }
  $('ev-salvar').disabled = true;
  const { data, error } = await db.rpc('cal_evento_salvar', { p_id: id, p_titulo: t, p_descricao: $('ev-desc').value, p_inicio: ini, p_fim: fim, p_hora_ini: $('ev-hi').value, p_hora_fim: $('ev-hf').value, p_cor: EV_COR, p_partilhado: $('ev-part').checked });
  $('ev-salvar').disabled = false;
  if (error) { msg.textContent = /cal_evento_salvar/.test(error.message || '') ? 'Rode o banco_de_dado_calendario.txt no Supabase para salvar eventos.' : 'Erro: ' + error.message; return; }
  if (data && data.erro) { msg.textContent = ERROS_EV[data.erro] || 'Não foi possível salvar.'; return; }
  fecharModal(); toast(id ? 'Evento atualizado.' : 'Evento criado.');
  await carregarEventos(); render2();
}
async function apagarEvento(id) {
  if (!confirm('Apagar este evento? Ele some também para quem via a partilha.')) return;
  const { data, error } = await db.rpc('cal_evento_apagar', { p_id: id });
  if (error) { $('ev-msg').textContent = 'Erro: ' + error.message; return; }
  if (data !== 'ok') { $('ev-msg').textContent = ERROS_EV[data] || 'Não foi possível apagar.'; return; }
  fecharModal(); toast('Evento apagado.'); await carregarEventos(); render2();
}

/* ---------- início ---------- */
window.addEventListener('DOMContentLoaded', async () => {
  const { data } = await db.auth.getSession();
  if (!data.session) { window.location.href = 'index.html'; return; }
  uid = data.session.user.id;
  render();
  await recarregarTudo();
  setInterval(() => { if (document.visibilityState === 'visible' && !$('modal-box').innerHTML) recarregarTudo(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !$('modal-box').innerHTML) recarregarTudo(); });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render2, 150); });
});
</script>
