<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fluxo - Calendário</title>
  <meta name="theme-color" content="#0d9488">
  <link rel="manifest" href="manifest.json">

  <script>
  (function () {
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var ACENTOS = /^(teal|blue|purple|red|orange|pink|green)$/;
    var FUNDOS = /^(padrao|eclipse|ocean|scarlet|amethyst|volcano)$/;
    function ler(k, pad) { try { return localStorage.getItem(k) || pad; } catch (e) { return pad; } }
    function modo() { var m = ler('fluxo_tema', 'auto'); return (m === 'light' || m === 'dark') ? m : 'auto'; }
    function accent() { var a = ler('fluxo_accent', 'teal'); return ACENTOS.test(a) ? a : 'teal'; }
    function fonte() { var f = ler('fluxo_fonte', ''); return (f === 'preto' || f === 'branco') ? f : ''; }
    function fundo() { var b = ler('fluxo_fundo', 'padrao'); return FUNDOS.test(b) ? b : 'padrao'; }
    function aplicar() {
      var m = modo(), t = m === 'auto' ? (mq && mq.matches ? 'dark' : 'light') : m;
      var ac = accent(), fo = fonte(), bg = fundo();
      var h = document.documentElement;
      h.setAttribute('data-theme', t);
      h.setAttribute('data-accent', ac);
      if (t === 'dark') h.setAttribute('data-bg', bg); else h.removeAttribute('data-bg');
      if (fo) h.setAttribute('data-fonte', fo); else h.removeAttribute('data-fonte');
    }
    aplicar();
    document.addEventListener('DOMContentLoaded', aplicar);
    window.addEventListener('storage', function (e) { if (e.key && /^fluxo_(tema|accent|fonte|fundo)$/.test(e.key)) aplicar(); });
    if (mq && mq.addEventListener) mq.addEventListener('change', aplicar);
  })();
  </script>

  <style>
  :root[data-theme="light"] { --bg: #f4f6fa; --card: #ffffff; --tx: #0f172a; --mut: #64748b; --pri: #0d9488; --pri-hover: #0f766e; --pri-light: #f0fdf4; --bd: #e6eaf0; --shadow: 0 4px 12px -1px rgba(0,0,0,0.08); }
  :root[data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --tx: #f8fafc; --mut: #9ca3af; --pri: #14b8a6; --pri-hover: #0d9488; --pri-light: #042f2e; --bd: #334155; --shadow: 0 4px 12px -1px rgba(0,0,0,0.4); }
  :root[data-theme="dark"][data-bg="eclipse"] { --bg: #000000; --card: #111111; --bd: #222222; }
  :root[data-theme="dark"][data-bg="ocean"] { --bg: #020617; --card: #0f172a; --bd: #1e293b; }
  :root[data-theme="dark"][data-bg="scarlet"] { --bg: #2a0808; --card: #3f0c0c; --bd: #5c1414; }
  :root[data-theme="dark"][data-bg="amethyst"] { --bg: #1e0a2d; --card: #2d1045; --bd: #4a1d6e; }
  :root[data-theme="dark"][data-bg="volcano"] { --bg: #2a1104; --card: #3f1a06; --bd: #5c260a; }
  :root[data-theme="light"][data-accent="blue"] { --pri: #2563eb; --pri-hover: #1f54c8; --pri-light: #e9effd; }
  :root[data-theme="dark"][data-accent="blue"] { --pri: #5585ef; --pri-hover: #2563eb; --pri-light: #132349; }
  :root[data-theme="light"][data-accent="purple"] { --pri: #7c3aed; --pri-hover: #6931c9; --pri-light: #f2ebfd; }
  :root[data-theme="dark"][data-accent="purple"] { --pri: #9965f1; --pri-hover: #7c3aed; --pri-light: #201d49; }
  :root[data-theme="light"][data-accent="red"] { --pri: #dc2626; --pri-hover: #bb2020; --pri-light: #fce9e9; }
  :root[data-theme="dark"][data-accent="red"] { --pri: #e45656; --pri-hover: #dc2626; --pri-light: #301929; }
  :root[data-theme="light"][data-accent="orange"] { --pri: #ea580c; --pri-hover: #c74b0a; --pri-light: #fdeee7; }
  :root[data-theme="dark"][data-accent="orange"] { --pri: #ef7d41; --pri-hover: #ea580c; --pri-light: #322125; }
  :root[data-theme="light"][data-accent="pink"] { --pri: #db2777; --pri-hover: #ba2165; --pri-light: #fbe9f1; }
  :root[data-theme="dark"][data-accent="pink"] { --pri: #e35795; --pri-hover: #db2777; --pri-light: #301a36; }
  :root[data-theme="light"][data-accent="green"] { --pri: #16a34a; --pri-hover: #138b3f; --pri-light: #e8f6ed; }
  :root[data-theme="dark"][data-accent="green"] { --pri: #49b772; --pri-hover: #16a34a; --pri-light: #102d2f; }
  :root[data-theme="light"][data-fonte="preto"] { --tx: #000000; }
  :root[data-theme="dark"][data-fonte="branco"] { --tx: #ffffff; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--tx); overflow: hidden; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding-top: env(safe-area-inset-top, 0px); }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  .app { height: calc(100dvh - env(safe-area-inset-top, 0px)); display: flex; gap: 14px; padding: 14px; }
  .side { width: 276px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .side-top { display: flex; align-items: center; gap: 8px; }
  .side-top b { font-size: 18px; font-weight: 800; flex: 1; }
  .ic { width: 38px; height: 38px; border: 0; border-radius: 12px; background: var(--card); color: var(--mut); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; border: 1px solid var(--bd); }
  .ic:hover { color: var(--tx); }
  .ic svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .hoje-card { border: 0; text-align: left; color: #fff; background: linear-gradient(145deg, var(--pri) 0%, var(--pri-hover) 100%); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .hc-data { display: flex; align-items: center; gap: 12px; }
  .hc-dia { font-size: 46px; font-weight: 800; line-height: 1; }
  .hc-data b { display: block; font-size: 15px; text-transform: capitalize; }
  .hc-data small { opacity: .88; font-size: 12.5px; }
  .hc-stats { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; }
  .hc-stats span { display: flex; align-items: center; gap: 8px; }
  .hc-stats i { width: 9px; height: 9px; border-radius: 50%; background: #fff; flex-shrink: 0; }
  .hc-stats .r i { background: #fecaca; box-shadow: 0 0 0 3px rgba(254,202,202,.35); }
  .hc-ver { font-size: 12px; font-weight: 800; opacity: .9; }

  .grupo { background: var(--card); border: 1px solid var(--bd); border-radius: 20px; padding: 14px; }
  .grupo h4 { margin: 0 0 10px; font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--mut); }
  .grupo small { color: var(--mut); font-size: 12px; display: block; margin-top: 8px; }
  .grupo small a { color: var(--pri); font-weight: 700; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .cam, .pes { --cc: #64748b; display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--bd); background: transparent; font-size: 12.5px; font-weight: 700; color: var(--mut); }
  .cam i { width: 9px; height: 9px; border-radius: 50%; background: var(--cc); opacity: .4; }
  .cam.on, .pes.on { color: var(--tx); border-color: var(--cc); background: color-mix(in srgb, var(--cc) 14%, transparent); }
  .cam.on i { opacity: 1; }
  .pes { padding: 4px 11px 4px 4px; }
  .pes .av { width: 24px; height: 24px; border-radius: 50%; background: var(--cc); color: #fff; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; opacity: .4; flex-shrink: 0; }
  .pes.on .av { opacity: 1; }
  .pes .av img { width: 100%; height: 100%; object-fit: cover; }
  .side-fim { margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding: 4px 4px 0; }
  .side-fim a { color: var(--mut); text-decoration: none; padding: 7px 8px; border-radius: 10px; font-weight: 700; font-size: 13px; }
  .side-fim a:hover { background: var(--card); color: var(--tx); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .barra { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tit-bloco { flex: 1; min-width: 160px; }
  .barra h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barra h1::first-letter { text-transform: uppercase; }
  .tit-bloco small { color: var(--mut); font-size: 12.5px; font-weight: 600; }
  .nav-pill, .abas { display: inline-flex; background: var(--card); border: 1px solid var(--bd); border-radius: 999px; padding: 3px; gap: 2px; }
  .nav-pill button, .abas button { border: 0; background: none; border-radius: 999px; height: 34px; min-width: 34px; padding: 0 14px; font-weight: 700; font-size: 13.5px; }
  .nav-pill button:hover { background: var(--bg); }
  .nav-pill svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
  .abas button { padding: 0 16px; color: var(--mut); }
  .abas button.on { background: var(--pri); color: #fff; }
  .data-pill { border: 1px solid var(--bd); background: var(--card); color: var(--tx); border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 600; height: 42px; }
  .btn-novo { border: 0; background: var(--pri); color: #fff; border-radius: 999px; padding: 0 18px; height: 42px; font-weight: 800; box-shadow: var(--shadow); }
  .btn-novo:hover { background: var(--pri-hover); }
  .btn-o { border: 1px solid var(--bd); background: transparent; border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 13.5px; }
  .btn-o:hover { background: var(--bg); }
  #btn-menu { display: none; }

  .aviso { padding: 10px 12px; border-radius: 14px; font-size: 13px; background: #fef3c7; color: #78350f; border: 1px solid #fcd34d; }
  :root[data-theme="dark"] .aviso { background: #3a2a07; color: #fde68a; border-color: #78561a; }
  .vista { flex: 1; overflow: auto; background: var(--card); border: 1px solid var(--bd); border-radius: 22px; padding: 12px; box-shadow: var(--shadow); -webkit-overflow-scrolling: touch; }

  /* mês: dias em cartões */
  .cab-sem { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; position: sticky; top: -12px; z-index: 4; background: var(--card); padding: 0 0 6px; }
  .cab-sem div { text-align: left; padding: 2px 8px; font-size: 11px; font-weight: 800; letter-spacing: .07em; color: var(--mut); }
  .sem { position: relative; margin-bottom: 6px; }
  .dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dia { background: var(--bg); border-radius: 14px; border: 2px solid transparent; min-height: calc(46px + var(--ln, 0) * 26px); padding: 6px 8px; text-align: left; }
  .dia.fora { opacity: .45; }
  .dia.sel { border-color: color-mix(in srgb, var(--pri) 45%, transparent); }
  .dia.hoje { border-color: var(--pri); background: color-mix(in srgb, var(--pri) 9%, var(--bg)); }
  .dnum { border: 0; background: none; padding: 0; height: 26px; min-width: 26px; border-radius: 13px; font-weight: 800; font-size: 13px; text-align: left; }
  .dnum:hover { text-decoration: underline; }
  .dia.hoje .dnum { background: var(--pri); color: #fff; text-align: center; padding: 0 7px; text-decoration: none; }
  .barras { position: absolute; top: 38px; left: 0; right: 0; display: grid; grid-template-columns: repeat(7, 1fr); column-gap: 6px; grid-auto-rows: 22px; row-gap: 4px; pointer-events: none; }

  /* etiquetas "suaves" (cor fica na lateral) */
  .chip { --cc: #64748b; pointer-events: auto; margin: 0 5px; border: 0; border-left: 4px solid var(--cc); border-radius: 8px; padding: 0 8px; font-size: 12px; font-weight: 700; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--tx); background-color: color-mix(in srgb, var(--cc) 20%, var(--card)); display: block; min-width: 0; height: 22px; line-height: 22px; }
  .chip:hover { background-color: color-mix(in srgb, var(--cc) 32%, var(--card)); }
  .chip.ci { margin-left: 0; border-left-width: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .chip.cf { margin-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .chip.conc { opacity: .6; text-decoration: line-through; }
  .c-amarela { --cc: #f59e0b; } .c-vermelha { --cc: #dc2626; } .c-azul { --cc: #2563eb; }
  .c-urg { --cc: #dc2626; background-image: repeating-linear-gradient(45deg, rgba(220,38,38,.30) 0 8px, rgba(220,38,38,.12) 8px 16px); }
  .c-fer { --cc: #3f8f5b; } .c-esc { --cc: var(--pri); }
  .e-azul { --cc: #3b82f6; } .e-verde { --cc: #16a34a; } .e-roxo { --cc: #8b5cf6; } .e-laranja { --cc: #ea580c; } .e-rosa { --cc: #db2777; } .e-cinza { --cc: #64748b; }
  .chip.troca { box-shadow: inset 0 0 0 1px var(--cc); }
  .tag-troca { display: inline-block; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--pri); background: color-mix(in srgb, var(--pri) 14%, transparent); border-radius: 999px; padding: 1px 8px; margin-left: 4px; }
  .chip.folga { background-image: repeating-linear-gradient(135deg, rgba(100,116,139,.28) 0 6px, transparent 6px 12px); }
  .mais { pointer-events: auto; border: 0; background: none; color: var(--mut); font-weight: 700; font-size: 11.5px; text-align: left; padding: 0 10px; height: 22px; }
  .mais:hover { color: var(--tx); text-decoration: underline; }

  /* visão Pessoas: uma faixa por pessoa */
  .pv { min-width: calc(176px + 14 * 62px); }
  .pv-cab, .lane { display: grid; grid-template-columns: 176px 1fr; }
  .pv-cab { position: sticky; top: -12px; z-index: 5; background: var(--card); padding-bottom: 2px; }
  .pv-dias, .lane-fundo, .lane-barras { display: grid; grid-template-columns: repeat(14, 1fr); }
  .p-dia { text-align: center; padding: 2px 0 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; color: var(--mut); cursor: pointer; text-transform: uppercase; }
  .p-dia b { display: block; font-size: 15px; letter-spacing: 0; color: var(--tx); margin-top: 1px; }
  .p-dia.hoje b { background: var(--pri); color: #fff; border-radius: 999px; width: 28px; height: 28px; line-height: 28px; margin: 1px auto 0; }
  .p-dia.fer::after { content: ''; display: block; width: 6px; height: 6px; border-radius: 50%; background: #3f8f5b; margin: 2px auto 0; }
  .lane { margin-top: 8px; background: var(--bg); border-radius: 16px; overflow: hidden; --cc: var(--pri); }
  .lane-nome { position: sticky; left: 0; z-index: 3; background: var(--bg); padding: 12px; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .lane-nome .av { width: 36px; height: 36px; border-radius: 50%; background: var(--cc); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 0 3px color-mix(in srgb, var(--cc) 28%, transparent); }
  .lane-nome .av img { width: 100%; height: 100%; object-fit: cover; }
  .lane-nome b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lane-nome small { color: var(--mut); font-size: 12px; }
  .lane-area { position: relative; min-height: 62px; }
  .lane-fundo { position: absolute; inset: 0; }
  .lane-fundo i { border-left: 1px solid color-mix(in srgb, var(--bd) 70%, transparent); }
  .lane-fundo i.fds { background: color-mix(in srgb, var(--mut) 8%, transparent); }
  .lane-fundo i.fer { background: color-mix(in srgb, #3f8f5b 13%, transparent); }
  .lane-fundo i.hoje { background: color-mix(in srgb, var(--pri) 13%, transparent); border-left-color: var(--pri); }
  .lane-barras { position: relative; grid-auto-rows: 24px; row-gap: 4px; padding: 8px 0; }
  .lane-barras .chip { height: 24px; line-height: 24px; }
  .pv-vazio { margin: 0; padding: 18px 12px; color: var(--mut); }

  /* aba Hoje */
  .hoje-v { max-width: 760px; margin: 0 auto; padding: 6px 4px 30px; display: flex; flex-direction: column; gap: 14px; }
  .h-card { background: var(--bg); border: 1px solid var(--bd); border-radius: 18px; padding: 14px 16px; }
  .h-card h3 { margin: 0 0 10px; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .h-card h3 .btn-o { padding: 5px 10px; font-size: 12.5px; }
  .h-item { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; text-align: left; padding: 9px 4px; border-top: 1px solid var(--bd); border-radius: 0; }
  .h-item:first-of-type { border-top: 0; }
  button.h-item:hover { background: var(--card); }
  .h-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; background: var(--cc, #94a3b8); }
  .h-tx { flex: 1; min-width: 0; }
  .h-tx b { display: block; font-size: 14px; overflow-wrap: anywhere; }
  .h-tx small { color: var(--mut); font-size: 12.5px; }
  .h-vazio { margin: 0; color: var(--mut); font-size: 13.5px; }
  .h-esc { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .h-pes { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 10px 12px; }
  .h-pes.eu { border-color: var(--pri); background: var(--pri-light); }
  .h-pes b { display: block; }
  .h-pes small { color: var(--mut); font-size: 12px; }
  .h-pes ol { margin: 8px 0 0; padding-left: 20px; font-size: 13.5px; }
  .h-pes i { color: var(--mut); font-size: 13px; }

  /* modal */
  .fundo-m { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--card); color: var(--tx); border: 1px solid var(--bd); border-radius: 22px; width: 100%; max-width: 460px; max-height: 92dvh; overflow-y: auto; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .modal h3 { margin: 0 0 12px; font-size: 18px; }
  .modal label { display: block; font-size: 12px; font-weight: 800; color: var(--mut); text-transform: uppercase; letter-spacing: .03em; margin: 10px 0 4px; }
  .modal input[type=text], .modal input[type=date], .modal input[type=time], .modal textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--bd); border-radius: 12px; background: var(--bg); color: var(--tx); font: inherit; font-size: 15px; }
  .modal textarea { resize: vertical; }
  .lin { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal .chk { display: flex; align-items: flex-start; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 13.5px; font-weight: 600; color: var(--tx); cursor: pointer; margin-top: 14px; }
  .modal .chk input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--pri); }
  .cores { display: flex; gap: 8px; flex-wrap: wrap; }
  .cores button { width: 28px; height: 28px; border-radius: 50%; border: 3px solid transparent; padding: 0; background: var(--cc); }
  .cores button.on { border-color: var(--tx); }
  .m-acoes { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .m-acoes .grow { margin-right: auto; }
  .btn-p { border: 0; background: var(--pri); color: #fff; border-radius: 12px; padding: 9px 16px; font-weight: 800; }
  .btn-p:hover { background: var(--pri-hover); }
  .btn-p:disabled { opacity: .55; }
  .btn-pe { border: 1px solid rgba(220,38,38,.5); background: transparent; color: #dc2626; border-radius: 12px; padding: 9px 14px; font-weight: 800; }
  .m-msg { margin: 10px 0 0; font-size: 13px; color: #dc2626; min-height: 16px; }
  .m-info p { margin: 4px 0; font-size: 14px; } .m-info small { color: var(--mut); }
  .pill-st { display: inline-block; padding: 3px 10px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 800; background: var(--cc, #64748b); }

  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--tx); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 60; max-width: 90vw; }

  @media (max-width: 860px) {
    .app { padding: 10px; gap: 0; }
    .side { position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: 290px; transform: translateX(-104%); transition: transform .2s; background: var(--bg); padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); }
    .side.aberto { transform: none; }
    #btn-menu { display: inline-flex; }
    .barra h1 { font-size: 21px; }
    .tit-bloco { order: 1; flex-basis: calc(100% - 52px); }
    .chip { font-size: 11px; padding: 0 5px; }
    .dia { padding: 5px 4px; }
    .lin { grid-template-columns: 1fr; }
  }
  </style>
</head>
<body>
<div class="app">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://xsgblgkzeiaxirquvpai.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yWYJb5jYgn1aBbng1-rr3w_JyHba3YC';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fotoOk = f => (typeof f === 'string' && /^data:image\//.test(f)) ? f : '';

/* ---------- datas ---------- */
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES_CURTO = ['jan.','fev.','mar.','abr.','mai.','jun.','jul.','ago.','set.','out.','nov.','dez.'];
const DIAS_LONGO = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const DIAS_CAB = ['DOM.','SEG.','TER.','QUA.','QUI.','SEX.','SÁB.'];
const isoDe = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const isoHoje = () => isoDe(new Date());
const parseIso = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const somaDias = (iso, n) => { const d = parseIso(iso); d.setDate(d.getDate() + n); return isoDe(d); };
const diasEntre = (a, b) => Math.round((parseIso(b) - parseIso(a)) / 86400000);
const dtBR = iso => iso.split('-').reverse().join('/');
const inicioSemana = iso => somaDias(iso, -parseIso(iso).getDay());

/* ---------- regras das FAAs (as mesmas do menu) ---------- */
const PRAZO_DIAS = 20;
const ehUrgente = r => Number(r.prazo_urgente) >= 1 && Number(r.prazo_urgente) <= 3;
const prazoDe = r => ehUrgente(r) ? Number(r.prazo_urgente) : PRAZO_DIAS;
const baseDe = r => (ehUrgente(r) && r.urgente_desde) ? r.urgente_desde : r.data;
function statusDe(r) {
  if (r.status === 'concluido') return 'concluido';
  if (diasEntre(baseDe(r), isoHoje()) > prazoDe(r)) return 'atrasado';
  if (ehUrgente(r)) return 'urgente';
  return r.status === 'executando' ? 'executando' : 'pendente';
}
const ST_ROT = { pendente: 'Pendente (no prazo)', executando: 'Executando', atrasado: 'Atrasada', concluido: 'Concluída', urgente: 'Jurídico / Urgente' };
const COR_ST = { pendente: '#f59e0b', executando: '#f59e0b', atrasado: '#dc2626', concluido: '#2563eb', urgente: '#dc2626' };
const COLS_BASE = 'id, user_id, data, categoria, responsavel, descricao, detalhe, status, executor, executor_id, iniciado_em, concluido_em';
let COLS = COLS_BASE + ', prazo_urgente, urgente_desde';

function periodo(r) {
  const ini = baseDe(r), venc = somaDias(ini, prazoDe(r));
  let fim = venc;
  if (r.status === 'concluido' && r.concluido_em) { const c = isoDe(new Date(r.concluido_em)); fim = c < ini ? ini : c; }
  else if (r.status !== 'concluido' && isoHoje() > venc) fim = isoHoje();   // atrasada: segue até hoje
  return { ini, fim, venc };
}

/* ---------- feriados nacionais (fixos + móveis) ---------- */
const FER_CACHE = {};
function pascoa(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mes - 1, dia);
}
function feriadosDe(y) {
  if (FER_CACHE[y]) return FER_CACHE[y];
  const m = {}, fx = [['01-01', 'Confraternização Universal'], ['04-21', 'Tiradentes'], ['05-01', 'Dia do Trabalho'], ['09-07', 'Independência do Brasil'], ['10-12', 'Nossa Senhora Aparecida'], ['11-02', 'Finados'], ['11-15', 'Proclamação da República'], ['11-20', 'Dia da Consciência Negra'], ['12-25', 'Natal']];
  fx.forEach(([md, n]) => { m[y + '-' + md] = n; });
  const p = isoDe(pascoa(y));
  m[somaDias(p, -47)] = 'Carnaval'; m[somaDias(p, -2)] = 'Sexta-feira Santa'; m[p] = 'Páscoa'; m[somaDias(p, 60)] = 'Corpus Christi';
  return (FER_CACHE[y] = m);
}
const feriadoDe = iso => feriadosDe(Number(iso.slice(0, 4)))[iso] || '';

/* ---------- estado ---------- */
let uid = null, EU = {}, PESSOAS = [], REL = [], EVT = [], ESC = [], SQL_CAL_OK = true, ITENS = {}, evJanela = '';
const CFG_PAD = { faa: true, conc: false, esc: true, ev: true, fer: true, off: {} };
let CFG = (() => { try { return Object.assign({}, CFG_PAD, JSON.parse(localStorage.getItem('fluxo_cal_cfg') || '{}')); } catch (e) { return Object.assign({}, CFG_PAD); } })();
const salvarCfg = () => { try { localStorage.setItem('fluxo_cal_cfg', JSON.stringify(CFG)); } catch (e) {} };
const S = { vista: 'mes', ref: isoHoje(), sel: isoHoje(), mini: isoHoje() };
{ const q = new URLSearchParams(location.search).get('v'); if (q === 'hoje' || q === 'pessoas' || q === 'mes') S.vista = q; else if (q === 'semana') S.vista = 'pessoas'; const dq = new URLSearchParams(location.search).get('d'); if (/^\d{4}-\d{2}-\d{2}$/.test(dq || '')) { S.ref = dq; S.sel = dq; S.mini = dq; } }

const CORES_PESSOA = ['#8b5cf6', '#ea580c', '#db2777', '#0ea5e9', '#16a34a', '#ca8a04', '#64748b', '#e11d48'];
const corPessoa = id => { const i = PESSOAS.filter(p => !p.eu).findIndex(p => p.user_id === id); return CORES_PESSOA[(i < 0 ? 0 : i) % CORES_PESSOA.length]; };
const pessoaPorId = id => PESSOAS.find(p => p.user_id === id) || null;
const primeiroNome = p => String((p && (p.nome || p.usuario)) || '').trim().split(/\s+/)[0] || '';
function donoNome(r) {
  if (r.user_id === uid) return 'Você';
  const p = pessoaPorId(r.user_id); if (p) return p.nome || p.usuario;
  return r.responsavel || 'Outra pessoa';
}
const donoVisivel = id => id === uid || CFG.off[id] !== true;

function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { el.hidden = true; }, 3200); }

/* ---------- janela visível ---------- */
const NDIAS_P = 14;
function janela() {
  if (S.vista === 'hoje') return { ini: S.sel, fim: S.sel };
  if (S.vista === 'pessoas') { const i = inicioSemana(S.ref); return { ini: i, fim: somaDias(i, NDIAS_P - 1) }; }
  const d = parseIso(S.ref), p = isoDe(new Date(d.getFullYear(), d.getMonth(), 1)), u = isoDe(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  return { ini: inicioSemana(p), fim: somaDias(inicioSemana(u), 6) };
}

/* ---------- escala por dia: ciclo de cada pessoa + trocas aceitas ---------- */
let ESC_BASES = [], TROCAS_PER = [], ESC_MEMO = {};
const baixo = x => String(x || '').toLowerCase();
const tarefasDe = txt => String(txt || '').split(/[\n;,]+/).map(x => x.trim()).filter(Boolean).map(t => t.charAt(0).toUpperCase() + t.slice(1));
const segundaDe = iso => { const d = parseIso(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoDe(d); };
const ehEu = x => !!x.usuario && baixo(x.usuario) === baixo(EU.usuario || '');

async function carregarEscalaBases() {
  const bases = [], vistos = new Set();
  const add = d => { if (!d || typeof d !== 'object') return; const k = baixo(d.dono_usuario || d.dono); if (vistos.has(k)) return; vistos.add(k); bases.push(d); };
  const proprio = await db.rpc('escala_ver', {});
  if (!proprio.error) add(proprio.data);
  const donos = await db.rpc('escala_donos');
  if (!donos.error && Array.isArray(donos.data)) {
    const outras = await Promise.all(donos.data.map(d => db.rpc('escala_ver', { p_dono: d.dono })));
    outras.forEach(r => { if (!r.error) add(r.data); });
  }
  ESC_BASES = bases; ESC_MEMO = {};
}
async function carregarTrocasPeriodo() {
  const { data, error } = await db.rpc('escala_trocas_periodo', { p_ini: somaDias(isoHoje(), -30), p_fim: somaDias(isoHoje(), 120) });
  TROCAS_PER = (!error && Array.isArray(data)) ? data : []; ESC_MEMO = {};
}

// Cada pessoa gira só nas semanas em que aparece; o servidor marca a linha "agora" (hoje). Para outro dia, avançamos
// uma posição no ciclo da pessoa a cada segunda-feira (previsão pelo ciclo).
function escalaDoDia(iso) {
  if (ESC_MEMO[iso]) return ESC_MEMO[iso];
  const out = [], diff = Math.round((parseIso(segundaDe(iso)) - parseIso(segundaDe(isoHoje()))) / (7 * 86400000)), dow = (parseIso(iso).getDay() + 6) % 7;
  ESC_BASES.forEach(b => {
    const dono = baixo(b.dono_usuario), pessoas = new Map();
    (b.semanas || []).forEach(sm => (sm.linhas || []).forEach(l => { const k = l.convidado ? 'c:' + baixo(l.convidado) : 'u:' + baixo(l.usuario); if (!pessoas.has(k)) pessoas.set(k, []); pessoas.get(k).push({ n: sm.numero, l }); }));
    pessoas.forEach(regs => {
      regs.sort((a, c) => a.n - c.n);
      const ag = regs.findIndex(r => r.l.agora); if (ag < 0) return;
      const alvo = regs[(((ag + diff) % regs.length) + regs.length) % regs.length], l = alvo.l;
      out.push({ dono, donoNome: b.dono_nome || b.dono_usuario || '', nome: l.nome || l.usuario || l.convidado || '?', usuario: l.convidado ? '' : String(l.usuario || ''), convidado: !!l.convidado, semana: alvo.n, tarefas: tarefasDe((l.dias || [])[dow]), troca: false });
    });
  });
  TROCAS_PER.filter(t => t.data === iso).forEach(t => {
    const a = out.find(x => x.dono === baixo(t.dono_usuario) && baixo(x.usuario) === baixo(t.de_usuario)), c = out.find(x => x.dono === baixo(t.dono_usuario) && baixo(x.usuario) === baixo(t.para_usuario));
    if (a && c) { const tmp = a.tarefas; a.tarefas = c.tarefas; c.tarefas = tmp; a.troca = c.troca = true; }
  });
  if (!out.length && iso === isoHoje() && ESC.length) ESC.forEach(x => out.push({ dono: '', donoNome: x.dono_nome || '', nome: x.nome || x.usuario || '?', usuario: x.convidado ? '' : String(x.usuario || ''), convidado: !!x.convidado, semana: x.semana_numero, tarefas: tarefasDe(x.tarefas), troca: false }));
  return (ESC_MEMO[iso] = out);
}

/* ---------- itens (FAAs, escala, eventos, feriados) ---------- */
function montarItens(ini, fim) {
  const lista = []; ITENS = {}; let n = 0;
  const add = it => { it.key = 'i' + (n++); ITENS[it.key] = it; lista.push(it); };
  const hoje = isoHoje();

  if (CFG.fer) {
    for (let d = ini; d <= fim; d = somaDias(d, 1)) { const f = feriadoDe(d); if (f) add({ tipo: 'fer', ini: d, fim: d, titulo: f, cls: 'c-fer', ord: 0 }); }
  }
  if (CFG.esc) {
    for (let d = ini; d <= fim; d = somaDias(d, 1)) {
      const lista = escalaDoDia(d).filter(x => x.tarefas.length); if (!lista.length) continue;
      add({ tipo: 'esc', ini: d, fim: d, titulo: 'Escala · ' + lista.length + (lista.length === 1 ? ' pessoa' : ' pessoas'), cls: 'c-esc' + (lista.some(x => x.troca) ? ' troca' : ''), ord: 1 });
    }
  }
  if (CFG.faa) {
    REL.forEach(r => {
      if (r.categoria !== 'faa' || !donoVisivel(r.user_id)) return;
      const sk = statusDe(r); if (sk === 'concluido' && !CFG.conc) return;
      const p = periodo(r); if (p.ini > fim || p.fim < ini) return;
      const cls = sk === 'concluido' ? 'c-azul conc' : (ehUrgente(r) ? 'c-urg' : (sk === 'atrasado' ? 'c-vermelha' : 'c-amarela'));
      add({ tipo: 'faa', r, sk, p, ini: p.ini, fim: p.fim, titulo: (r.user_id === uid ? '' : primeiroNome({ nome: donoNome(r) }) + ' · ') + r.descricao, cls, ord: 3 });
    });
  }
  if (CFG.ev) {
    EVT.forEach(e => {
      if (!e.meu && !donoVisivel(e.dono_id)) return;
      if (e.inicio > fim || e.fim < ini) return;
      const dono = e.meu ? null : pessoaPorId(e.dono_id);
      const folga = e.tipo === 'folga';
      add({ tipo: 'ev', e, ini: e.inicio, fim: e.fim, titulo: (folga ? 'Folga · ' : '') + (e.hora_ini ? e.hora_ini + ' ' : '') + (dono ? primeiroNome(dono) + ': ' : '') + e.titulo, cls: 'e-' + e.cor + (folga ? ' folga' : ''), ord: 2 });
    });
  }
  return lista;
}

/* ---------- grade (mês/semana) ---------- */
function semanaHTML(d0, itens, maxLanes, refMes) {
  const dias = Array.from({ length: 7 }, (_, i) => somaDias(d0, i)), d6 = dias[6];
  const segs = itens.filter(it => it.ini <= d6 && it.fim >= d0).map(it => ({ it, c0: Math.max(0, diasEntre(d0, it.ini)), c1: Math.min(6, diasEntre(d0, it.fim)), ci: it.ini < d0, cf: it.fim > d6 }));
  segs.sort((a, b) => a.c0 - b.c0 || (b.c1 - b.c0) - (a.c1 - a.c0) || a.it.ord - b.it.ord || a.it.ini.localeCompare(b.it.ini));
  const busy = [], oculto = Array(7).fill(0); let usadas = 0;
  segs.forEach(s => {
    let l = 0; while (busy[l] && busy[l].slice(s.c0, s.c1 + 1).some(Boolean)) l++;
    busy[l] = busy[l] || Array(7).fill(false); for (let c = s.c0; c <= s.c1; c++) busy[l][c] = true; s.l = l;
    if (l < maxLanes) usadas = Math.max(usadas, l + 1); else for (let c = s.c0; c <= s.c1; c++) oculto[c]++;
  });
  const temMais = oculto.some(Boolean), linhas = usadas + (temMais ? 1 : 0), hoje = isoHoje();
  let h = '<div class="sem"><div class="dias" style="--ln:' + linhas + '">';
  dias.forEach(d => {
    const dt = parseIso(d), rot = dt.getDate() === 1 ? dt.getDate() + ' ' + MES_CURTO[dt.getMonth()] : dt.getDate();
    h += '<div class="dia' + (refMes != null && dt.getMonth() !== refMes ? ' fora' : '') + (d === hoje ? ' hoje' : '') + (d === S.sel ? ' sel' : '') + '" data-d="' + d + '"><button type="button" class="dnum" data-d="' + d + '" title="Ver o dia">' + rot + '</button></div>';
  });
  h += '</div><div class="barras">';
  segs.filter(s => s.l < maxLanes).forEach(s => {
    h += '<button type="button" class="chip ' + s.it.cls + (s.ci ? ' ci' : '') + (s.cf ? ' cf' : '') + '" style="grid-row:' + (s.l + 1) + ';grid-column:' + (s.c0 + 1) + '/' + (s.c1 + 2) + '" data-k="' + s.it.key + '" title="' + esc(s.it.titulo) + '">' + esc(s.it.titulo) + '</button>';
  });
  oculto.forEach((n, c) => { if (n) h += '<button type="button" class="mais" style="grid-row:' + (usadas + 1) + ';grid-column:' + (c + 1) + '" data-d="' + dias[c] + '">+' + n + ' mais</button>'; });
  return h + '</div></div>';
}

function renderMes() {
  const w = janela(), itens = montarItens(w.ini, w.fim), mobile = window.innerWidth <= 860, refMes = parseIso(S.ref).getMonth(), max = mobile ? 3 : 4;
  let h = '<div class="cab-sem">' + DIAS_CAB.map(n => '<div>' + n + '</div>').join('') + '</div>';
  for (let d = w.ini; d <= w.fim; d = somaDias(d, 7)) h += semanaHTML(d, itens, max, refMes);
  $('vista').className = 'vista mes'; $('vista').innerHTML = h;
}

function lanear(lista, d0, n) {
  const ult = somaDias(d0, n - 1);
  const segs = lista.filter(it => it.ini <= ult && it.fim >= d0).map(it => ({ it, c0: Math.max(0, diasEntre(d0, it.ini)), c1: Math.min(n - 1, diasEntre(d0, it.fim)), ci: it.ini < d0, cf: it.fim > ult }));
  segs.sort((a, b) => a.c0 - b.c0 || (b.c1 - b.c0) - (a.c1 - a.c0) || a.it.ord - b.it.ord);
  const busy = [];
  segs.forEach(s => { let l = 0; while (busy[l] && busy[l].slice(s.c0, s.c1 + 1).some(Boolean)) l++; busy[l] = busy[l] || Array(n).fill(false); for (let c = s.c0; c <= s.c1; c++) busy[l][c] = true; s.l = l; });
  return segs;
}

function renderPessoas() {
  const w = janela(), itens = montarItens(w.ini, w.fim), hoje = isoHoje();
  const dias = Array.from({ length: NDIAS_P }, (_, i) => somaDias(w.ini, i));
  const eu = PESSOAS.find(p => p.eu) || { user_id: uid, nome: EU.nome || 'Você', usuario: EU.usuario || '', eu: true };
  const linhas = [{ id: eu.user_id || uid, p: eu }];
  PESSOAS.filter(p => !p.eu && donoVisivel(p.user_id)).forEach(p => linhas.push({ id: p.user_id, p }));
  const conhecidos = new Set(linhas.map(l => l.id));
  const donoDe = it => it.tipo === 'faa' ? it.r.user_id : (it.tipo === 'ev' ? it.e.dono_id : null);
  const itensPessoa = itens.filter(it => it.tipo === 'faa' || it.tipo === 'ev');
  const convidados = new Map();
  if (CFG.esc) dias.forEach(d => escalaDoDia(d).forEach(x => { if (x.convidado && x.tarefas.length && !convidados.has(baixo(x.nome))) convidados.set(baixo(x.nome), x.nome); }));
  convidados.forEach((nome, k) => linhas.push({ id: 'g:' + k, p: { nome, usuario: '' }, convidado: true }));
  if (itensPessoa.some(it => !conhecidos.has(donoDe(it)))) linhas.push({ id: '_outros', p: { nome: 'Outros', usuario: '' }, outros: true });

  const fundoCls = d => { const dow = parseIso(d).getDay(); return (d === hoje ? 'hoje' : (CFG.fer && feriadoDe(d) ? 'fer' : (dow === 0 || dow === 6 ? 'fds' : ''))); };
  let n = 0;

  let h = '<div class="pv"><div class="pv-cab"><div class="lane-nome" style="padding:6px 12px"><small style="font-weight:800;letter-spacing:.07em">PESSOAS</small></div><div class="pv-dias">' +
    dias.map(d => { const dt = parseIso(d), fer = CFG.fer ? feriadoDe(d) : ''; return '<div class="p-dia' + (d === hoje ? ' hoje' : '') + (fer ? ' fer' : '') + '" data-d="' + d + '" title="' + esc(fer || 'Ver o dia') + '">' + DIAS_CAB[dt.getDay()].slice(0, 3) + '<b>' + dt.getDate() + '</b></div>'; }).join('') + '</div></div>';

  linhas.forEach(l => {
    const lista = itensPessoa.filter(it => l.outros ? !conhecidos.has(donoDe(it)) : donoDe(it) === l.id);

        if (!e || !e.tarefas.length) return;
        const it = { key: 'p' + (n++), tipo: 'esc', ini: d, fim: d, titulo: (e.troca ? 'Troca · ' : '') + e.tarefas.join(' · '), cls: 'c-esc' + (e.troca ? ' troca' : ''), ord: 1 };
        ITENS[it.key] = it; lista.push(it);
      });
    }
    const segs = lanear(lista, w.ini, NDIAS_P);
    const nf = lista.filter(i => i.tipo === 'faa').length, ne = lista.filter(i => i.tipo === 'ev').length;
    const cor = l.p.eu ? 'var(--pri)' : ((l.outros || l.convidado) ? '#64748b' : corPessoa(l.id)), nome = l.p.eu ? 'Você' : (l.p.nome || l.p.usuario || 'Pessoa'), f = fotoOk(l.p.foto);
    h += '<div class="lane" style="--cc:' + cor + '"><div class="lane-nome"><span class="av">' + (f ? '<img src="' + esc(f) + '" alt="">' : esc(nome.trim().charAt(0).toUpperCase())) + '</span><span style="min-width:0"><b>' + esc(nome) + '</b><small>' + (l.convidado ? 'Convidado · ' : '') + nf + (nf === 1 ? ' FAA' : ' FAAs') + (ne ? ' · ' + ne + (ne === 1 ? ' evento' : ' eventos') : '') + '</small></span></div>' +
      '<div class="lane-area"><div class="lane-fundo">' + dias.map(d => '<i class="' + fundoCls(d) + '"></i>').join('') + '</div><div class="lane-barras">' +
      segs.map(s => '<button type="button" class="chip ' + s.it.cls + (s.ci ? ' ci' : '') + (s.cf ? ' cf' : '') + '" style="grid-row:' + (s.l + 1) + ';grid-column:' + (s.c0 + 1) + '/' + (s.c1 + 2) + '" data-k="' + s.it.key + '" title="' + esc(s.it.titulo) + '">' + esc(s.it.titulo) + '</button>').join('') +
      '</div></div></div>';
  });
  if (!CFG.faa && !CFG.ev && !CFG.esc) h += '<p class="pv-vazio">Todas as camadas estão desligadas. Ligue alguma na barra lateral.</p>';
  $('vista').className = 'vista pessoas'; $('vista').innerHTML = h + '</div>';
}

/* ---------- aba Hoje (dia) ---------- */
function renderDia() {
  const d = S.sel, hoje = isoHoje(), dt = parseIso(d), ehHoje = d === hoje;
  const w = { ini: d, fim: d }, itens = montarItens(w.ini, w.fim);
  const fer = feriadoDe(d);
  let h = '<div class="hoje-v">';
  h += '<div style="font-size:13px;color:var(--mut);font-weight:700">' + (ehHoje ? 'HOJE' : (d < hoje ? 'DIA PASSADO' : 'DIA FUTURO')) + '</div>';
  if (fer) h += '<div class="h-card"><div class="h-item"><span class="h-dot" style="background:#3f8f5b"></span><div class="h-tx"><b>' + esc(fer) + '</b><small>Feriado nacional</small></div></div></div>';

  if (CFG.esc) {
    const lista = escalaDoDia(d), futuro = d >= hoje;
    h += '<div class="h-card"><h3>Escala<span style="display:flex;gap:6px">' + (futuro && lista.length ? '<a class="btn-o" href="escala.html?troca=' + d + '" style="text-decoration:none;color:inherit">Pedir troca</a>' : '') + '<a class="btn-o" href="escala.html" style="text-decoration:none;color:inherit">Abrir escala</a></span></h3>';
    if (!lista.length) h += '<p class="h-vazio">Nenhuma escala montada para este dia.</p>';
    else h += '<div class="h-esc">' + lista.map(x => {
      const nome = x.nome, eu = ehEu(x);
      return '<div class="h-pes' + (eu ? ' eu' : '') + '"><b>' + esc(eu ? nome + ' (você)' : nome) + (x.troca ? ' <span class="tag-troca">troca</span>' : '') + '</b><small>Semana ' + esc(x.semana) + (x.convidado ? ' · convidado' : '') + (x.donoNome && !eu && x.donoNome !== (EU.nome || '') ? ' · escala de ' + esc(x.donoNome) : '') + '</small>' +
        (x.tarefas.length ? '<ol>' + x.tarefas.map(t => '<li>' + esc(t) + '</li>').join('') + '</ol>' : '<div style="margin-top:8px"><i>Sem função</i></div>') + '</div>';
    }).join('') + '</div>' + (d !== hoje ? '<p class="h-vazio" style="margin-top:10px;font-size:12px">Para outros dias a escala é uma previsão pelo ciclo de cada pessoa (a semana avança toda segunda-feira) e já considera as trocas aceitas.</p>' : '');
    h += '</div>';
  }

  if (CFG.faa) {
    const fa = itens.filter(i => i.tipo === 'faa').sort((a, b) => ({ atrasado: 0, urgente: 1, executando: 2, pendente: 3, concluido: 4 }[a.sk] - { atrasado: 0, urgente: 1, executando: 2, pendente: 3, concluido: 4 }[b.sk]) || a.p.venc.localeCompare(b.p.venc));
    h += '<div class="h-card"><h3>FAAs com prazo neste dia <span style="font-weight:600;color:var(--mut);font-size:12.5px">' + fa.length + '</span></h3>';
    h += fa.length ? fa.map(i => {
      const rest = diasEntre(d, i.p.venc), txt = i.sk === 'concluido' ? 'Concluída' : (rest < 0 ? 'venceu há ' + (-rest) + (rest === -1 ? ' dia' : ' dias') : rest === 0 ? 'vence neste dia' : 'vence em ' + rest + (rest === 1 ? ' dia' : ' dias'));
      return '<button type="button" class="h-item" data-k="' + i.key + '"><span class="h-dot" style="background:' + COR_ST[i.sk] + '"></span><span class="h-tx"><b>' + esc(i.r.descricao) + '</b><small>' + esc(donoNome(i.r)) + ' · pedida ' + dtBR(i.p.ini) + ' · ' + txt + '</small></span></button>';
    }).join('') : '<p class="h-vazio">Nenhuma FAA neste dia.</p>';
    h += '</div>';
  }

  if (CFG.ev) {
    const ev = itens.filter(i => i.tipo === 'ev').sort((a, b) => String(a.e.hora_ini || '').localeCompare(String(b.e.hora_ini || '')));
    h += '<div class="h-card"><h3>Eventos<button type="button" class="btn-o" id="btn-ev-dia">+ Evento neste dia</button></h3>';
    h += ev.length ? ev.map(i => {
      const e = i.e, dono = e.meu ? 'Você' : (pessoaPorId(e.dono_id) ? (pessoaPorId(e.dono_id).nome || pessoaPorId(e.dono_id).usuario) : 'Alguém');
      return '<button type="button" class="h-item" data-k="' + i.key + '"><span class="h-dot ' + 'e-' + e.cor + '"></span><span class="h-tx"><b>' + esc(e.titulo) + '</b><small>' + (e.tipo === 'folga' ? 'Folga / ausência · ' : '') + (e.hora_ini ? e.hora_ini + (e.hora_fim ? '–' + e.hora_fim : '') + ' · ' : '') + esc(dono) + (e.inicio !== e.fim ? ' · ' + dtBR(e.inicio) + ' a ' + dtBR(e.fim) : '') + '</small></span></button>';
    }).join('') : '<p class="h-vazio">Nenhum evento neste dia.</p>';
    h += '</div>';
  }
  $('vista').className = 'vista hoje'; $('vista').innerHTML = h + '</div>';
}

/* ---------- barra lateral ---------- */
const CAMADAS = [['faa', 'FAAs e prazos', '#f59e0b'], ['conc', 'Concluídas', '#2563eb'], ['esc', 'Escala', 'var(--pri)'], ['ev', 'Eventos', '#8b5cf6'], ['fer', 'Feriados', '#3f8f5b']];
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);

function renderLateral() {
  $('camadas').innerHTML = CAMADAS.map(([k, r, c]) => '<button type="button" class="cam' + (CFG[k] ? ' on' : '') + '" style="--cc:' + c + '" data-c="' + k + '"><i></i>' + r + '</button>').join('');

  const outras = PESSOAS.filter(p => !p.eu);
  let h = '';
  if (!SQL_CAL_OK) h = '<small>As agendas das pessoas ainda não estão ativas.</small>';
  else if (!outras.length) h = '<small>Ninguém aceitou ainda. <a href="perfil.html#pessoas">Adicionar pessoas</a></small>';
  else h = outras.map(p => {
    const f = fotoOk(p.foto), n = p.nome || p.usuario;
    return '<button type="button" class="pes' + (CFG.off[p.user_id] === true ? '' : ' on') + '" style="--cc:' + corPessoa(p.user_id) + '" data-p="' + esc(p.user_id) + '"><span class="av">' + (f ? '<img src="' + esc(f) + '" alt="">' : esc(n.trim().charAt(0).toUpperCase())) + '</span>' + esc(primeiroNome(p)) + '</button>';
  }).join('');
  $('outras').innerHTML = h;

  // cartão de hoje
  const hoje = isoHoje(), dt = parseIso(hoje);
  $('hc-dia').textContent = dt.getDate(); $('hc-sem').textContent = DIAS_LONGO[dt.getDay()]; $('hc-mes').textContent = MESES[dt.getMonth()] + ' de ' + dt.getFullYear();
  const vis = REL.filter(r => r.categoria === 'faa' && r.status !== 'concluido' && donoVisivel(r.user_id));
  const atr = vis.filter(r => statusDe(r) === 'atrasado').length;
  const urg = vis.filter(r => ehUrgente(r) && statusDe(r) !== 'atrasado').length;
  const prox = vis.filter(r => { const st = statusDe(r); return st !== 'atrasado' && !ehUrgente(r) && diasEntre(hoje, somaDias(baseDe(r), prazoDe(r))) <= 3; }).length;
  const l = [];
  if (atr) l.push('<span class="r"><i></i>' + plural(atr, 'FAA atrasada', 'FAAs atrasadas') + '</span>');
  if (urg) l.push('<span class="r"><i></i>' + plural(urg, 'jurídico urgente', 'jurídicos urgentes') + '</span>');
  if (prox) l.push('<span><i></i>' + plural(prox, 'vence', 'vencem') + ' em até 3 dias</span>');
  const escHoje = escalaDoDia(hoje).filter(x => x.tarefas.length).length || (ESC_BASES.length ? 0 : ESC.length);
  if (escHoje) l.push('<span><i></i>Escala hoje: ' + plural(escHoje, 'pessoa', 'pessoas') + '</span>');
  if (!l.length) l.push('<span><i></i>Tudo em dia por aqui</span>');
  $('hc-stats').innerHTML = l.join('');
}

function titulo() {
  const d = parseIso(S.ref);
  if (S.vista === 'mes') return MESES[d.getMonth()] + ' de ' + d.getFullYear();
  if (S.vista === 'pessoas') { const a = parseIso(inicioSemana(S.ref)), b = parseIso(somaDias(inicioSemana(S.ref), NDIAS_P - 1)); return a.getMonth() === b.getMonth() ? a.getDate() + ' – ' + b.getDate() + ' de ' + MESES[b.getMonth()] : a.getDate() + ' ' + MES_CURTO[a.getMonth()] + ' – ' + b.getDate() + ' ' + MES_CURTO[b.getMonth()]; }
  const s = parseIso(S.sel); return DIAS_LONGO[s.getDay()] + ', ' + s.getDate() + ' de ' + MESES[s.getMonth()];
}
const subtitulo = () => S.vista === 'mes' ? 'Prazos das FAAs, eventos e escala' : (S.vista === 'pessoas' ? 'Quem está com o quê, nas próximas duas semanas' : (S.sel === isoHoje() ? 'Hoje' : String(parseIso(S.sel).getFullYear())));

function desenhar() { if (S.vista === 'hoje') renderDia(); else if (S.vista === 'pessoas') renderPessoas(); else renderMes(); }
function render() {
  $('titulo').textContent = titulo(); $('sub-titulo').textContent = subtitulo(); $('ir-data').value = S.sel;
  document.querySelectorAll('#abas button').forEach(b => b.classList.toggle('on', b.dataset.v === S.vista));
  desenhar(); renderLateral();
  const w = janela(), chave = w.ini + '|' + w.fim;
  if (chave !== evJanela) carregarEventos().then(() => { if (evJanela === chave) render2(); });
}
function render2() { desenhar(); renderLateral(); }

/* ---------- dados ---------- */
async function carregarRel() {
  let { data, error } = await db.from('relatorio').select(COLS).order('id', { ascending: false }).limit(500);
  if (error && /prazo_urgente|urgente_desde/.test(error.message || '')) { COLS = COLS_BASE; ({ data, error } = await db.from('relatorio').select(COLS).order('id', { ascending: false }).limit(500)); }
  if (!error) REL = data || [];
}
async function carregarEscala() {
  const { data, error } = await db.rpc('escala_hoje');
  ESC = (!error && Array.isArray(data)) ? data : [];
}
async function carregarPessoas() {
  const { data, error } = await db.rpc('cal_pessoas');
  if (error) { SQL_CAL_OK = false; PESSOAS = []; return; }
  PESSOAS = Array.isArray(data) ? data : [];
  const eu = PESSOAS.find(p => p.eu); if (eu) EU = eu;
}
async function carregarEventos() {
  const w = janela(); evJanela = w.ini + '|' + w.fim;
  const { data, error } = await db.rpc('cal_eventos', { p_ini: w.ini, p_fim: w.fim });
  if (error) { SQL_CAL_OK = false; EVT = []; }
  else { SQL_CAL_OK = true; EVT = Array.isArray(data) ? data : []; }
  const av = $('aviso-sql'); av.hidden = SQL_CAL_OK;
  if (!SQL_CAL_OK) av.innerHTML = 'Para ativar o calendário geral partilhado e as agendas das pessoas, rode o arquivo <b>banco_de_dado_calendario.txt</b> no SQL Editor do Supabase. As FAAs, a escala e os feriados já funcionam.';
}
async function recarregarTudo() {
  await Promise.all([carregarRel(), carregarEscala(), carregarPessoas()]);
  await Promise.all([carregarEscalaBases(), carregarTrocasPeriodo()]);
  await carregarEventos();
  render2();
}

/* ---------- navegação ---------- */
function mover(n) {
  if (S.vista === 'mes') { const d = parseIso(S.ref); S.ref = isoDe(new Date(d.getFullYear(), d.getMonth() + n, 1)); }
  else if (S.vista === 'pessoas') S.ref = somaDias(S.ref, 7 * n);
  else { S.sel = somaDias(S.sel, n); S.ref = S.sel; }
  render();
}
function irPara(iso, vista) { S.ref = iso; S.sel = iso; if (vista) S.vista = vista; render(); }
$('btn-hoje').onclick = () => irPara(isoHoje());
$('btn-ant').onclick = () => mover(-1);
$('btn-prox').onclick = () => mover(1);
$('abas').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; S.vista = b.dataset.v; if (S.vista !== 'mes') S.ref = S.sel; render(); };
$('ir-data').onchange = e => { if (e.target.value) irPara(e.target.value); };
$('btn-menu').onclick = () => $('side').classList.add('aberto');
const fecharSide = () => $('side').classList.remove('aberto');
document.addEventListener('click', e => { if ($('side').classList.contains('aberto') && !e.target.closest('#side') && !e.target.closest('#btn-menu')) fecharSide(); });

$('side').addEventListener('click', e => {
  const c = e.target.closest('[data-c]'), p = e.target.closest('[data-p]');
  if (c) { CFG[c.dataset.c] = !CFG[c.dataset.c]; salvarCfg(); render2(); return; }
  if (p) { const id = p.dataset.p; if (CFG.off[id]) delete CFG.off[id]; else CFG.off[id] = true; salvarCfg(); render2(); return; }
  if (e.target.closest('#hoje-card')) { irPara(isoHoje(), 'hoje'); fecharSide(); }
});

$('vista').addEventListener('click', e => {
  const k = e.target.closest('[data-k]');
  if (k) return abrirItem(ITENS[k.dataset.k]);
  const d = e.target.closest('[data-d]');
  if (d) {
    if (d.classList.contains('dnum') || d.classList.contains('mais') || d.classList.contains('p-dia')) return irPara(d.dataset.d, 'hoje');
    S.sel = d.dataset.d; document.querySelectorAll('.dia.sel').forEach(x => x.classList.remove('sel')); d.classList.add('sel'); $('ir-data').value = S.sel;
  }
  if (e.target.id === 'btn-ev-dia') abrirForm(null, S.sel);
});
$('btn-criar').onclick = () => { abrirForm(null, S.sel); fecharSide(); };

/* ---------- modais ---------- */
function abrirModal(html) {
  $('modal-box').innerHTML = '<div class="fundo-m" id="fundo-m"><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>';
  $('fundo-m').addEventListener('mousedown', e => { if (e.target.id === 'fundo-m') fecharModal(); });
}
function fecharModal() { $('modal-box').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

function abrirItem(it) {
  if (!it) return;
  if (it.tipo === 'esc') return irPara(it.ini, 'hoje');
  if (it.tipo === 'fer') return;
  if (it.tipo === 'ev') return it.e.meu ? abrirForm(it.e) : abrirEvento(it.e);
  const r = it.r, p = it.p, rest = diasEntre(isoHoje(), p.venc);
  const txt = it.sk === 'concluido' ? 'Concluída' + (r.concluido_em ? ' em ' + dtBR(isoDe(new Date(r.concluido_em))) : '') : (rest < 0 ? 'venceu há ' + (-rest) + (rest === -1 ? ' dia' : ' dias') : rest === 0 ? 'vence hoje' : 'vence em ' + rest + (rest === 1 ? ' dia' : ' dias'));
  abrirModal('<h3>' + esc(r.descricao) + '</h3><div class="m-info"><p><span class="pill-st" style="background:' + COR_ST[it.sk] + '">' + esc(ST_ROT[it.sk]) + '</span></p>' +
    '<p><b>Pessoa:</b> ' + esc(donoNome(r)) + '</p>' + (r.responsavel && r.user_id === uid ? '<p><b>Responsável:</b> ' + esc(r.responsavel) + '</p>' : '') +
    (r.executor ? '<p><b>Executando:</b> ' + esc(r.executor) + '</p>' : '') +
    '<p><b>Pedida em:</b> ' + dtBR(p.ini) + '</p><p><b>Prazo (vencimento):</b> ' + dtBR(p.venc) + ' <small>· ' + txt + '</small></p>' +
    (r.detalhe ? '<p><b>Detalhe:</b> ' + esc(r.detalhe) + '</p>' : '') + '</div>' +
    '<div class="m-acoes"><button type="button" class="btn-o" onclick="fecharModal()">Fechar</button><a class="btn-p" style="text-decoration:none" href="menu.html?faa=' + encodeURIComponent(r.id) + '">Abrir no painel</a></div>');
}

function abrirEvento(e) {
  const p = pessoaPorId(e.dono_id), quem = p ? (p.nome || p.usuario) : 'Alguém';
  abrirModal('<h3>' + esc(e.titulo) + '</h3><div class="m-info"><p><span class="pill-st e-' + e.cor + '">' + (e.tipo === 'folga' ? 'Folga / ausência de ' : 'Partilhado por ') + esc(quem) + '</span></p>' +
    '<p><b>Quando:</b> ' + dtBR(e.inicio) + (e.fim !== e.inicio ? ' a ' + dtBR(e.fim) : '') + (e.hora_ini ? ' · ' + e.hora_ini + (e.hora_fim ? '–' + e.hora_fim : '') : '') + '</p>' +
    (e.descricao ? '<p>' + esc(e.descricao).replace(/\n/g, '<br>') + '</p>' : '') + '</div>' +

let EV_COR = 'azul', EV_TIPO = 'evento';

    '<label for="ev-desc">Descrição</label><textarea id="ev-desc" rows="3" maxlength="2000">' + esc(novo ? '' : (e.descricao || '')) + '</textarea>' +
    '<label class="chk"><input type="checkbox" id="ev-part"' + (novo || e.partilhado ? ' checked' : '') + '><span>Partilhar com as minhas pessoas (quem aceitou o seu pedido vê este evento)</span></label>' +
    '<p class="m-msg" id="ev-msg"></p>' +
    '<div class="m-acoes">' + (novo ? '' : '<button type="button" class="btn-pe grow" id="ev-apagar">Apagar</button>') + '<button type="button" class="btn-o" onclick="fecharModal()">Cancelar</button><button type="button" class="btn-p" id="ev-salvar">Salvar</button></div>');
  $('ev-tipo').onclick = x => { const b = x.target.closest('[data-t]'); if (!b) return; EV_TIPO = b.dataset.t; document.querySelectorAll('#ev-tipo button').forEach(y => y.classList.toggle('on', y === b)); if (EV_TIPO === 'folga' && novo) { EV_COR = 'cinza'; document.querySelectorAll('#ev-cores button').forEach(y => y.classList.toggle('on', y.dataset.c === 'cinza')); } };
  $('ev-cores').onclick = x => { const b = x.target.closest('[data-c]'); if (!b) return; EV_COR = b.dataset.c; document.querySelectorAll('#ev-cores button').forEach(y => y.classList.toggle('on', y === b)); };
  $('ev-ini').onchange = () => { if ($('ev-fim').value < $('ev-ini').value) $('ev-fim').value = $('ev-ini').value; };
  $('ev-salvar').onclick = () => salvarEvento(novo ? null : e.id);
  if (!novo) $('ev-apagar').onclick = () => apagarEvento(e.id);
  setTimeout(() => $('ev-titulo').focus(), 30);
}

const ERROS_EV = { titulo: 'Escreva um título (até 120 letras).', datas: 'Confira as datas: o fim não pode ser antes do início (máx. 1 ano).', hora: 'Hora inválida.', descricao: 'Descrição muito longa.', limite: 'Limite de eventos atingido.', nao_encontrado: 'Esse evento não existe mais.', sem_permissao: 'Sessão inválida. Entre de novo.' };
async function salvarEvento(id) {
  const msg = $('ev-msg'), t = $('ev-titulo').value.trim(), ini = $('ev-ini').value, fim = $('ev-fim').value || ini;
  if (!t) { msg.textContent = ERROS_EV.titulo; return; }
  if (!ini || fim < ini) { msg.textContent = ERROS_EV.datas; return; }
  $('ev-salvar').disabled = true;
  const { data, error } = await db.rpc('cal_evento_salvar', { p_id: id, p_titulo: t, p_descricao: $('ev-desc').value, p_inicio: ini, p_fim: fim, p_hora_ini: $('ev-hi').value, p_hora_fim: $('ev-hf').value, p_cor: EV_COR, p_partilhado: $('ev-part').checked, p_tipo: EV_TIPO });
  $('ev-salvar').disabled = false;
  if (error) { msg.textContent = /cal_evento_salvar/.test(error.message || '') ? 'Rode o banco_de_dado_calendario.txt e depois o banco_de_dado_ideias.txt no Supabase para salvar eventos e folgas.' : 'Erro: ' + error.message; return; }
  if (data && data.erro) { msg.textContent = ERROS_EV[data.erro] || 'Não foi possível salvar.'; return; }
  fecharModal(); toast(id ? 'Evento atualizado.' : 'Evento criado.');
  await carregarEventos(); render2();
}
async function apagarEvento(id) {
  if (!confirm('Apagar este evento? Ele some também para quem via a partilha.')) return;
  const { data, error } = await db.rpc('cal_evento_apagar', { p_id: id });
  if (error) { $('ev-msg').textContent = 'Erro: ' + error.message; return; }
  if (data !== 'ok') { $('ev-msg').textContent = ERROS_EV[data] || 'Não foi possível apagar.'; return; }
  fecharModal(); toast('Evento apagado.'); await carregarEventos(); render2();
}

/* ---------- início ---------- */
window.addEventListener('DOMContentLoaded', async () => {
  const { data } = await db.auth.getSession();
  if (!data.session) { window.location.href = 'index.html'; return; }
  uid = data.session.user.id;
  render();
  await recarregarTudo();
  setInterval(() => { if (document.visibilityState === 'visible' && !$('modal-box').innerHTML) recarregarTudo(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !$('modal-box').innerHTML) recarregarTudo(); });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render2, 150); });
});
</script>
