<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#0d9488">
  <link rel="manifest" href="manifest.json">

  <script>
  (function () {
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var ACENTOS = /^(teal|blue|purple|red|orange|pink|green)$/;
    var FUNDOS = /^(padrao|eclipse|ocean|scarlet|amethyst|volcano)$/;
    function ler(k, pad) { try { return localStorage.getItem(k) || pad; } catch (e) { return pad; } }
    function modo() { var m = ler('fluxo_tema', 'auto'); return (m === 'light' || m === 'dark') ? m : 'auto'; }
    function accent() { var a = ler('fluxo_accent', 'teal'); return ACENTOS.test(a) ? a : 'teal'; }
    function fonte() { var f = ler('fluxo_fonte', ''); return (f === 'preto' || f === 'branco') ? f : ''; }
    function fundo() { var b = ler('fluxo_fundo', 'padrao'); return FUNDOS.test(b) ? b : 'padrao'; }
    function aplicar() {
      var m = modo(), t = m === 'auto' ? (mq && mq.matches ? 'dark' : 'light') : m;
      var ac = accent(), fo = fonte(), bg = fundo();
      var h = document.documentElement;
      h.setAttribute('data-theme', t);
      h.setAttribute('data-accent', ac);
      if (t === 'dark') h.setAttribute('data-bg', bg); else h.removeAttribute('data-bg');
      if (fo) h.setAttribute('data-fonte', fo); else h.removeAttribute('data-fonte');
    }
    aplicar();
    document.addEventListener('DOMContentLoaded', aplicar);
    window.addEventListener('storage', function (e) { if (e.key && /^fluxo_(tema|accent|fonte|fundo)$/.test(e.key)) aplicar(); });
    if (mq && mq.addEventListener) mq.addEventListener('change', aplicar);
  })();
  </script>

  <style>

  /* MENU LATERAL (sidebar) */
  .sidebar { position: fixed; top: 0; left: 0; height: 100vh; width: 240px; background: var(--dock-bg); border-right: 1px solid var(--bd); z-index: 95; display: flex; flex-direction: column; padding: 18px 0; padding-top: max(18px, env(safe-area-inset-top, 0px)); transition: width 0.2s ease; }

  .sb-badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--pri); color: #fff; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .sidebar { overflow: hidden; }

/* ---------- CICLO DO SETOR ----------

const pKey = p => p.convidado ? 'c:' + p.cid : 'u:' + String(p.usuario).toLowerCase();
const lc = s => String(s || '').toLowerCase();
function cicloLinhasDe(k) { return (CICLO.linhas || []).filter(l => l.chave === k).sort((a, b) => a.numero - b.numero); }
function cicloValor(k, iso) {
  const ls = cicloLinhasDe(k); if (!ls.length) return '';

  const n = error ? 0 : (Number(data) || 0);
  el.hidden = !n; el.textContent = n > 99 ? '99+' : n;
  el.title = n ? n + (n === 1 ? ' pedido para aceitar' : ' pedidos para aceitar') : '';
}
async function carregarPessoas(silencioso) {
  const lista = $('sb-pessoas-lista'); if (!lista) return;
  if (!silencioso) lista.innerHTML = '<p class="pessoas-vazio">A carregar...</p>';
  const [p, r] = await Promise.all([db.rpc('listar_contatos'), db.rpc('chat_resumo')]);
  if (p.error) { if (!silencioso) lista.innerHTML = '<p class="pessoas-vazio">Não foi possível carregar.</p>'; return; }
  const nao = {}; let total = 0;
  (r.data || []).forEach(x => { const n = x.nao_lidas || 0; nao[String(x.usuario).toLowerCase()] = n; total += n; });
  const mb = $('menu-btn-badge'); if (mb) { mb.hidden = !total; mb.textContent = total > 99 ? '99+' : total; }
  const vistos = new Set(), data = (p.data || []).filter(x => { const k = String(x.usuario).toLowerCase(); if (vistos.has(k)) return false; vistos.add(k); return true; }).sort((a, b) => String(a.nome || a.usuario).localeCompare(String(b.nome || b.usuario)));
  if (!data.length) lista.innerHTML = '<p class="pessoas-vazio">Ninguém adicionado ainda.</p>';
  else lista.innerHTML = data.map(x => {
    const nome = x.nome || x.usuario || 'Sem nome', f = fotoOk(x.foto), n = nao[String(x.usuario).toLowerCase()] || 0;
    const av = f ? '<img src="' + esc(f) + '" alt="">' : esc(nome.trim().charAt(0).toUpperCase());
    return '<button type="button" class="sb-pessoa" data-u="' + esc(x.usuario) + '" title="Conversar com ' + esc(nome) + '"><span class="pessoa-av">' + av + '</span><span class="pessoa-nome">' + esc(nome) + '</span>' + (n ? '<span class="sb-badge">' + (n > 99 ? '99+' : n) + '</span>' : '') + '</button>';
  }).join('');
  carregarPedidosBadge(); carregarTrocasBadge();
  if (!tPessoasMenu) tPessoasMenu = setInterval(() => carregarPessoas(true), 15000);
}
// o chat flutuante fica no menu: abre lá com a pessoa escolhida
$('sb-pessoas-lista').addEventListener('click', e => {
  const b = e.target.closest('.sb-pessoa'); if (!b) return;
  window.location.href = 'menu.html?chat=' + encodeURIComponent(b.dataset.u);
});
function sidebarPreferida() {
  try { const v = localStorage.getItem('fluxo_sidebar'); if (v === 'aberta' || v === 'fechada') return v; } catch (e) {}
  return window.innerWidth < 1280 ? 'fechada' : 'aberta';
}
const ehMobile = () => window.innerWidth <= 760;
function aplicarSidebar() {
  const sb = $('sidebar'); if (!sb) return;
  sb.classList.toggle('recolhida', !ehMobile() && sidebarPreferida() === 'fechada');
  if (!ehMobile()) fecharDrawer();
}
function fecharDrawer() {
  const sb = $('sidebar'), ov = $('sb-overlay');
  if (sb) sb.classList.remove('aberta-mobile'); if (ov) ov.classList.remove('on');
}
function toggleSidebar() {
  if (ehMobile()) {
    const sb = $('sidebar'), abrir = !sb.classList.contains('aberta-mobile');
    sb.classList.toggle('aberta-mobile', abrir); $('sb-overlay').classList.toggle('on', abrir);
    return;
  }
  const nova = sidebarPreferida() === 'aberta' ? 'fechada' : 'aberta';
  try { localStorage.setItem('fluxo_sidebar', nova); } catch (e) {}
  aplicarSidebar();
}
document.addEventListener('DOMContentLoaded', aplicarSidebar);
window.addEventListener('resize', aplicarSidebar);
async function sair() { await db.auth.signOut(); window.location.href = 'index.html'; }
</script>
