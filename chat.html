<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fluxo - Chat</title>
  <meta name="theme-color" content="#0d9488">

  <script>
  (function () {
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var ACENTOS = /^(teal|blue|purple|red|orange|pink|green)$/;
    var FUNDOS = /^(padrao|eclipse|ocean|scarlet|amethyst|volcano)$/;
    function ler(k, pad) { try { return localStorage.getItem(k) || pad; } catch (e) { return pad; } }
    function modo() { var m = ler('fluxo_tema', 'auto'); return (m === 'light' || m === 'dark') ? m : 'auto'; }
    function accent() { var a = ler('fluxo_accent', 'teal'); return ACENTOS.test(a) ? a : 'teal'; }
    function fonte() { var f = ler('fluxo_fonte', ''); return (f === 'preto' || f === 'branco') ? f : ''; }
    function fundo() { var b = ler('fluxo_fundo', 'padrao'); return FUNDOS.test(b) ? b : 'padrao'; }
    function aplicar() {
      var m = modo(), t = m === 'auto' ? (mq && mq.matches ? 'dark' : 'light') : m;
      var ac = accent(), fo = fonte(), bg = fundo();
      var h = document.documentElement;
      h.setAttribute('data-theme', t);
      h.setAttribute('data-accent', ac);
      if (t === 'dark') h.setAttribute('data-bg', bg); else h.removeAttribute('data-bg');
      if (fo) h.setAttribute('data-fonte', fo); else h.removeAttribute('data-fonte');
    }
    aplicar();
    document.addEventListener('DOMContentLoaded', aplicar);
    window.addEventListener('storage', function (e) { if (e.key && /^fluxo_(tema|accent|fonte|fundo)$/.test(e.key)) aplicar(); });
    if (mq && mq.addEventListener) mq.addEventListener('change', aplicar);
  })();
  </script>

  <style>
  :root[data-theme="light"] { --bg: #f4f6fa; --card: #ffffff; --tx: #0f172a; --mut: #64748b; --pri: #0d9488; --pri-hover: #0f766e; --pri-light: #f0fdf4; --bd: #e6eaf0; --recebida: #eef1f5; --shadow: 0 4px 12px -1px rgba(0,0,0,0.08); }
  :root[data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --tx: #f8fafc; --mut: #9ca3af; --pri: #14b8a6; --pri-hover: #0d9488; --pri-light: #042f2e; --bd: #334155; --recebida: #273449; --shadow: 0 4px 12px -1px rgba(0,0,0,0.4); }
  :root[data-theme="dark"][data-bg="eclipse"] { --bg: #000000; --card: #111111; --bd: #222222; --recebida: #1c1c1c; }
  :root[data-theme="dark"][data-bg="ocean"] { --bg: #020617; --card: #0f172a; --bd: #1e293b; --recebida: #1b2740; }
  :root[data-theme="dark"][data-bg="scarlet"] { --bg: #2a0808; --card: #3f0c0c; --bd: #5c1414; --recebida: #521212; }
  :root[data-theme="dark"][data-bg="amethyst"] { --bg: #1e0a2d; --card: #2d1045; --bd: #4a1d6e; --recebida: #3b1759; }
  :root[data-theme="dark"][data-bg="volcano"] { --bg: #2a1104; --card: #3f1a06; --bd: #5c260a; --recebida: #54220a; }
  :root[data-theme="light"][data-accent="blue"] { --pri: #2563eb; --pri-hover: #1f54c8; --pri-light: #e9effd; }
  :root[data-theme="dark"][data-accent="blue"] { --pri: #5585ef; --pri-hover: #2563eb; --pri-light: #132349; }
  :root[data-theme="light"][data-accent="purple"] { --pri: #7c3aed; --pri-hover: #6931c9; --pri-light: #f2ebfd; }
  :root[data-theme="dark"][data-accent="purple"] { --pri: #9965f1; --pri-hover: #7c3aed; --pri-light: #201d49; }
  :root[data-theme="light"][data-accent="red"] { --pri: #dc2626; --pri-hover: #bb2020; --pri-light: #fce9e9; }
  :root[data-theme="dark"][data-accent="red"] { --pri: #e45656; --pri-hover: #dc2626; --pri-light: #301929; }
  :root[data-theme="light"][data-accent="orange"] { --pri: #ea580c; --pri-hover: #c74b0a; --pri-light: #fdeee7; }
  :root[data-theme="dark"][data-accent="orange"] { --pri: #ef7d41; --pri-hover: #ea580c; --pri-light: #322125; }
  :root[data-theme="light"][data-accent="pink"] { --pri: #db2777; --pri-hover: #ba2165; --pri-light: #fbe9f1; }
  :root[data-theme="dark"][data-accent="pink"] { --pri: #e35795; --pri-hover: #db2777; --pri-light: #301a36; }
  :root[data-theme="light"][data-accent="green"] { --pri: #16a34a; --pri-hover: #138b3f; --pri-light: #e8f6ed; }
  :root[data-theme="dark"][data-accent="green"] { --pri: #49b772; --pri-hover: #16a34a; --pri-light: #102d2f; }
  :root[data-theme="light"][data-fonte="preto"] { --tx: #000000; }
  :root[data-theme="dark"][data-fonte="branco"] { --tx: #ffffff; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--tx); overflow: hidden;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
  }
  button { font: inherit; color: inherit; }

  .shell { height: 100dvh; max-width: 1100px; margin: 0 auto; display: flex; background: var(--bg); padding-top: 0; }
  @supports not (height: 100dvh) { .shell { height: 100vh; } }
  .shell { height: calc(100dvh - env(safe-area-inset-top, 0px)); }

  .painel-lista { width: 100%; display: flex; flex-direction: column; min-width: 0; background: var(--card); }
  .painel-conv { width: 100%; display: none; flex-direction: column; min-width: 0; background: var(--bg); }
  .shell.em-conversa .painel-lista { display: none; }
  .shell.em-conversa .painel-conv { display: flex; }

  @media (min-width: 820px) {
    .shell { border-left: 1px solid var(--bd); border-right: 1px solid var(--bd); }
    .painel-lista { width: 340px; flex-shrink: 0; border-right: 1px solid var(--bd); }
    .painel-conv { display: flex; flex: 1; }
    .shell.em-conversa .painel-lista { display: flex; }
    .btn-voltar-conv { display: none !important; }
  }

  .topo { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--bd); background: var(--card); min-height: 58px; }
  .topo h1 { font-size: 18px; margin: 0; font-weight: 800; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ic { width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent; color: var(--mut); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0; }
  .ic:hover { background: var(--bg); color: var(--tx); }
  .ic svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .add-box { padding: 12px 14px; border-bottom: 1px solid var(--bd); }
  .add-box label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--mut); margin-bottom: 6px; letter-spacing: .04em; }
  .add-row { display: flex; gap: 8px; }
  .add-row input { flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid var(--bd); border-radius: 12px; background: var(--bg); color: var(--tx); font: inherit; font-size: 16px; outline: none; }
  .add-row input:focus { border-color: var(--pri); }
  .btn { border: 0; border-radius: 12px; padding: 0 16px; background: var(--pri); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; min-height: 44px; }
  .btn:hover { background: var(--pri-hover); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .msg-add { font-size: 12.5px; margin: 8px 0 0; min-height: 16px; }
  .msg-add.erro { color: #dc2626; }
  .msg-add.ok { color: var(--pri); }


  /* pedidos de amizade (aceitação) e sugestões */
  .pedidos-box { padding: 10px 14px 6px; border-bottom: 1px solid var(--bd); background: var(--pri-light); }
  .pedidos-tit { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--mut); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .ped-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; flex-wrap: wrap; }
  .ped-item .p-info { flex: 1; min-width: 120px; }
  .ped-item small { display: block; color: var(--mut); font-size: 12px; }
  .ped-acoes { display: flex; gap: 6px; margin-left: auto; }
  .mini { border: 0; border-radius: 10px; padding: 0 12px; min-height: 34px; font-weight: 700; font-size: 13px; cursor: pointer; background: var(--pri); color: #fff; white-space: nowrap; }
  .mini:hover { background: var(--pri-hover); }
  .mini:disabled { opacity: .55; cursor: not-allowed; }
  .mini.sec { background: transparent; color: var(--tx); border: 1px solid var(--bd); }
  .mini.sec:hover { background: var(--bg); }
  .mini.perigo { background: transparent; color: #dc2626; border: 1px solid rgba(220,38,38,.5); }
  .sug-box { border-bottom: 1px solid var(--bd); }
  .sug-box summary { cursor: pointer; padding: 11px 14px; font-size: 13px; font-weight: 700; color: var(--pri); list-style: none; display: flex; justify-content: space-between; align-items: center; }
  .sug-box summary::-webkit-details-marker { display: none; }
  .sug-box summary::after { content: '\25BE'; color: var(--mut); }
  .sug-box[open] summary::after { content: '\25B4'; }
  .sug-lista { max-height: 260px; overflow-y: auto; padding: 0 14px 8px; }
  .sug-nota { font-size: 12px; color: var(--mut); margin: 0 0 4px; }

  .lista { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px; }
  .pessoa { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border: 0; background: transparent; border-radius: 14px; cursor: pointer; text-align: left; }
  .pessoa:hover { background: var(--bg); }
  .pessoa.ativa { background: var(--pri-light); }
  .av { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, var(--pri), var(--pri-hover)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; flex-shrink: 0; overflow: hidden; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .av.sm { width: 38px; height: 38px; font-size: 15px; }
  .p-info { flex: 1; min-width: 0; }
  .p-linha { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .p-nome { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-hora { font-size: 11px; color: var(--mut); flex-shrink: 0; }
  .p-sub { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-top: 2px; }
  .p-ultima { font-size: 13px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--pri); color: #fff; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .vazio-txt { color: var(--mut); text-align: center; padding: 28px 18px; font-size: 14px; }

  .conv-topo-info { flex: 1; min-width: 0; line-height: 1.2; }
  .conv-topo-info b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-topo-info small { color: var(--mut); font-size: 12px; }
  .msgs { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px; overscroll-behavior: contain; }
  .dia-sep { align-self: center; margin: 10px 0 6px; font-size: 11px; font-weight: 700; color: var(--mut); background: var(--card); border: 1px solid var(--bd); padding: 3px 10px; border-radius: 999px; }
  .bolha { max-width: 82%; padding: 8px 12px 6px; border-radius: 18px; word-break: break-word; overflow-wrap: anywhere; white-space: pre-wrap; font-size: 15px; line-height: 1.4; }
  .bolha time { display: block; margin-top: 2px; font-size: 10.5px; opacity: .7; text-align: right; white-space: nowrap; }
  .bolha.minha { align-self: flex-end; background: var(--pri); color: #fff; border-bottom-right-radius: 6px; }
  .bolha.outra { align-self: flex-start; background: var(--recebida); color: var(--tx); border-bottom-left-radius: 6px; }
  .bolha.enviando { opacity: .6; }
  .bolha a { color: inherit; text-decoration: underline; font-weight: 700; }
  .conv-vazia { margin: auto; text-align: center; color: var(--mut); padding: 24px; font-size: 14px; }
  .sem-selecao { margin: auto; text-align: center; color: var(--mut); padding: 24px; }
  .sem-selecao svg { width: 54px; height: 54px; stroke: var(--bd); fill: none; stroke-width: 1.5; margin-bottom: 8px; }
  .sem-selecao p { margin: 4px 0 0; font-size: 14px; }

  .envio { display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--bd); background: var(--card); }
  .envio textarea { flex: 1; min-width: 0; resize: none; max-height: 130px; padding: 11px 14px; border: 1px solid var(--bd); border-radius: 22px; background: var(--bg); color: var(--tx); font: inherit; font-size: 16px; line-height: 1.35; outline: none; }
  .envio textarea:focus { border-color: var(--pri); }
  .btn-enviar { width: 46px; height: 46px; border: 0; border-radius: 50%; background: var(--pri); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0; }
  .btn-enviar:hover { background: var(--pri-hover); }
  .btn-enviar:disabled { opacity: .5; cursor: not-allowed; }
  .btn-enviar svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .oculto { display: none !important; }

  /* apagar mensagem */
  .ic.perigo:hover { color: #dc2626; }
  .acoes-msg { display: none; justify-content: flex-end; margin-top: 4px; white-space: normal; }
  .bolha.minha.sel .acoes-msg { display: flex; }
  @media (hover: hover) { .bolha.minha:hover .acoes-msg { display: flex; } }
  .btn-apagar-msg { border: 1px solid rgba(255,255,255,.7); background: rgba(0,0,0,.15); color: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .btn-apagar-msg:hover { background: rgba(0,0,0,.3); }

  /* PDF na conversa */
  .arq { display: flex; align-items: center; gap: 10px; min-width: 190px; padding: 8px 10px; margin-bottom: 2px; border-radius: 12px; background: rgba(0,0,0,.14); cursor: pointer; white-space: normal; }
  .bolha.outra .arq { background: var(--card); border: 1px solid var(--bd); }
  .arq.carregando { opacity: .6; pointer-events: none; }
  .arq svg { width: 28px; height: 28px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .arq-info { display: flex; flex-direction: column; min-width: 0; }
  .arq-nome { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .arq-sub { font-size: 11.5px; opacity: .75; }
  .envio .ic { margin-bottom: 3px; }

  /* aviso de espaço (800 MB) */
  .aviso-espaco { margin: 10px 14px 0; padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.4; background: #fef3c7; color: #78350f; border: 1px solid #fcd34d; }
  :root[data-theme="dark"] .aviso-espaco { background: #3a2a07; color: #fde68a; border-color: #78561a; }
  .aviso-acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .btn-peq { border: 0; border-radius: 10px; padding: 8px 12px; background: var(--pri); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
  .btn-peq.perigo { background: #dc2626; }
  .btn-peq.sec { background: transparent; color: inherit; border: 1px solid currentColor; }
  .btn-peq:disabled { opacity: .55; cursor: not-allowed; }

  /* janela "Limpar chat" */
  .modal-fundo { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { width: 100%; max-width: 400px; background: var(--card); color: var(--tx); border: 1px solid var(--bd); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); }
  .modal h2 { margin: 0 0 6px; font-size: 18px; }
  .modal p { margin: 0 0 12px; font-size: 13px; color: var(--mut); }
  .modal label { display: block; margin: 10px 0 5px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--mut); }
  .modal select { width: 100%; padding: 11px 12px; border: 1px solid var(--bd); border-radius: 12px; background: var(--bg); color: var(--tx); font: inherit; font-size: 15px; }
  .modal-acoes { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal-res { font-size: 13px; margin-top: 10px; min-height: 16px; color: var(--pri); }
  .modal-res.erro { color: #dc2626; }
  </style>
</head>
<body>

<div class="shell" id="shell">

  <!-- LISTA: pessoas + adicionar -->
  <section class="painel-lista" id="painel-lista">
    <div class="topo">
      <button type="button" class="ic" onclick="window.location.href='menu.html'" title="Voltar ao menu" aria-label="Voltar ao menu">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <h1>Chat</h1>
      <button type="button" class="ic" id="btn-limpar-topo" title="Limpar chat (liberar espaço)" aria-label="Limpar chat">
        <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      </button>
    </div>

    <div class="aviso-espaco oculto" id="aviso-espaco"></div>

    <div class="add-box">
      <label for="novo-usuario">Adicionar pessoa (ela precisa aceitar)</label>
      <div class="add-row">
        <input id="novo-usuario" placeholder="Utilizador (ex: maria.silva)" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
        <button type="button" class="btn" id="btn-add" onclick="adicionarPessoa()">Pedir</button>
      </div>
      <p class="msg-add" id="msg-add"></p>
    </div>

    <div class="pedidos-box oculto" id="box-pedidos">
      <div class="pedidos-tit">Pedidos para você aceitar <span class="badge" id="qtd-pedidos">0</span></div>
      <div id="lista-pedidos"></div>
    </div>

    <details class="sug-box" id="box-sug">
      <summary>Sugestões para adicionar</summary>
      <div class="sug-lista" id="lista-sug"><p class="vazio-txt">A carregar...</p></div>
    </details>

    <div class="lista" id="lista"><p class="vazio-txt">A carregar...</p></div>
  </section>

  <!-- CONVERSA -->
  <section class="painel-conv" id="painel-conv">
    <div class="topo oculto" id="conv-topo">
      <button type="button" class="ic btn-voltar-conv" onclick="fecharConversa()" title="Voltar" aria-label="Voltar para a lista">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="av sm" id="conv-av"></span>
      <div class="conv-topo-info"><b id="conv-nome"></b><small id="conv-user"></small></div>
      <button type="button" class="ic perigo" id="btn-apagar-conv" title="Apagar conversa" aria-label="Apagar conversa">
        <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      </button>
    </div>

    <div class="msgs" id="msgs">
      <div class="sem-selecao">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <p>Escolha uma pessoa para conversar.</p>
      </div>
    </div>

    <form class="envio oculto" id="envio" autocomplete="off">
      <button type="button" class="ic" id="btn-anexo" title="Enviar PDF (até 5 MB)" aria-label="Enviar PDF">
        <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input type="file" id="arquivo" accept="application/pdf,.pdf" class="oculto">
      <textarea id="texto" rows="1" placeholder="Escreva uma mensagem..." maxlength="2000" enterkeyhint="enter"></textarea>
      <button type="submit" class="btn-enviar" id="btn-enviar" title="Enviar" aria-label="Enviar">
        <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </section>
</div>

<div class="modal-fundo oculto" id="modal-limpar">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="limpar-titulo">
    <h2 id="limpar-titulo">Limpar chat</h2>
    <p id="limpar-uso"></p>
    <label for="limpar-modo">O que apagar</label>
    <select id="limpar-modo">
      <option value="pdfs">Só os PDFs (a mensagem do PDF some junto)</option>
      <option value="tudo">Mensagens e PDFs</option>
    </select>
    <label for="limpar-dias">De quando</label>
    <select id="limpar-dias">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://xsgblgkzeiaxirquvpai.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yWYJb5jYgn1aBbng1-rr3w_JyHba3YC';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fotoOk = f => (typeof f === 'string' && /^data:image\//.test(f)) ? f : '';

let uid = null, PESSOAS = [], RESUMO = {}, atual = null, ULTIMO_ID = 0, tPoll = null, canal = null, enviando = false, USO = null, ultimoUso = 0;

const avatar = p => { const f = fotoOk(p.foto), n = p.nome || p.usuario || '?'; return f ? '<img src="' + esc(f) + '" alt="">' : esc(n.trim().charAt(0).toUpperCase()); };
const hhmm = iso => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
function diaRotulo(iso) {
  const d = new Date(iso), h = new Date(), ontem = new Date(); ontem.setDate(h.getDate() - 1);
  const mesmo = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (mesmo(d, h)) return 'Hoje'; if (mesmo(d, ontem)) return 'Ontem';
  return d.toLocaleDateString('pt-BR');
}
function horaLista(iso) {
  if (!iso) return '';
  const d = new Date(iso), h = new Date();
  return (d.toDateString() === h.toDateString()) ? hhmm(iso) : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
}

/* ---------- formatar links nas mensagens ---------- */
function formatarMensagem(texto) {
  const urlRegex = /(https?:\/\/[^\s]+)|(www\.[^\s]+)/gi;
  let limpo = esc(texto);
  return limpo.replace(urlRegex, function(url) {
    let href = url;
    if (url.toLowerCase().startsWith('www.')) {
      href = 'http://' + url;
    }
    return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
  });
}

/* ---------- início ---------- */
window.addEventListener('DOMContentLoaded', async () => {

});

/* ---------- lista de pessoas ---------- */
async function carregarLista() {
  const [p, r] = await Promise.all([db.rpc('listar_contatos'), db.rpc('chat_resumo')]);
  PESSOAS = (p.data || []).slice();
  RESUMO = {};
  (r.data || []).forEach(x => { RESUMO[String(x.usuario).toLowerCase()] = x; });
  if (r.error && !p.error) avisoAdd('O chat ainda não foi ativado no banco (rode o fluxo_update5_chat.sql).', 'erro');
  renderLista();
}

function renderLista() {
  const box = $('lista');
  if (!PESSOAS.length) { box.innerHTML = '<p class="vazio-txt">Ninguém adicionado ainda.<br>Envie um pedido pelo utilizador ou veja as sugestões acima.</p>'; return; }
  const ord = PESSOAS.slice().sort((a, b) => {
    const ra = RESUMO[String(a.usuario).toLowerCase()], rb = RESUMO[String(b.usuario).toLowerCase()];
    const ta = ra && ra.ultima_em ? +new Date(ra.ultima_em) : 0, tb = rb && rb.ultima_em ? +new Date(rb.ultima_em) : 0;
    if (ta !== tb) return tb - ta;
    return String(a.nome || a.usuario).localeCompare(String(b.nome || b.usuario));
  });
  box.innerHTML = ord.map(p => {
    const k = String(p.usuario).toLowerCase(), r = RESUMO[k], nome = p.nome || p.usuario;

    return '<button type="button" class="pessoa' + (atual === k ? ' ativa' : '') + '" data-u="' + esc(p.usuario) + '">' +
      '<span class="av">' + avatar(p) + '</span>' +
      '<span class="p-info"><span class="p-linha"><span class="p-nome">' + esc(nome) + '</span><span class="p-hora">' + esc(horaLista(r && r.ultima_em)) + '</span></span>' +
      '<span class="p-sub"><span class="p-ultima">' + (r && r.ultima_texto ? esc(resumoTexto(r.ultima_texto)) : '@' + esc(p.usuario)) + '</span>' +
      (nl ? '<span class="badge">' + (nl > 99 ? '99+' : nl) + '</span>' : '') + '</span></span></button>';
  }).join('');
}

$('lista').addEventListener('click', e => {

});

/* ---------- adicionar pessoa: pedido + aceitação ---------- */
let SUGESTOES = [], PED_REC = [], PED_ENV = [], SQL_PED_OK = true;
function avisoAdd(t, tipo) { const el = $('msg-add'); el.textContent = t; el.className = 'msg-add ' + (tipo || ''); }

const MSG_PEDIDO = {
  ok: u => 'Pedido enviado para @' + u + '. Só funciona quando a pessoa aceitar.',
  aceito: u => '@' + u + ' já tinha pedido para você: agora vocês podem conversar!',
  ja_contato: u => '@' + u + ' já está na sua lista.',
  ja_pendente: u => 'Você já enviou um pedido para @' + u + '.',
  nao_encontrado: u => 'Não encontrei @' + u + '.',
  proprio: () => 'Esse é o seu próprio utilizador.',
  sem_permissao: () => 'Sessão inválida. Entre de novo.'
};

async function solicitarPessoa(u) {
  const { data, error } = await db.rpc('contato_solicitar', { p_usuario: u });
  if (error) {
    avisoAdd(/contato_solicitar/.test(error.message || '') ? 'Rode o banco_de_dado_aceitacao.txt no Supabase para ativar os pedidos.' : 'Erro: ' + error.message, 'erro');
    return false;
  }
  const f = MSG_PEDIDO[data];
  avisoAdd(f ? f(u) : 'Não foi possível enviar o pedido para @' + u + '.', (data === 'ok' || data === 'aceito') ? 'ok' : 'erro');
  await Promise.all([carregarLista(), carregarPedidos(true)]);
  return data === 'ok' || data === 'aceito';
}

async function adicionarPessoa() {
  const u = $('novo-usuario').value.trim().replace(/^@/, '').toLowerCase();
  if (!u) return avisoAdd('Escreva o utilizador da pessoa.', 'erro');
  $('btn-add').disabled = true;
  const ok = await solicitarPessoa(u);
  $('btn-add').disabled = false;
  if (ok) $('novo-usuario').value = '';
}
$('novo-usuario').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); adicionarPessoa(); } });

async function carregarPedidos(comSugestoes) {
  const jobs = [db.rpc('contato_pedidos')];
  if (comSugestoes || $('box-sug').open) jobs.push(db.rpc('contato_sugestoes'));
  const [pd, sg] = await Promise.all(jobs);
  SQL_PED_OK = !pd.error;
  const ped = (pd.data && typeof pd.data === 'object') ? pd.data : {};
  PED_REC = ped.recebidos || []; PED_ENV = ped.enviados || [];
  if (sg) { if (sg.error) SQL_PED_OK = false; else SUGESTOES = Array.isArray(sg.data) ? sg.data : []; }
  renderPedidos();
}

function cartaoPessoa(p, acoes) {
  const nome = p.nome || p.usuario;
  return '<div class="ped-item"><span class="av sm">' + avatar(p) + '</span><span class="p-info"><span class="p-nome">' + esc(nome) + '</span><small>@' + esc(p.usuario) + '</small></span><span class="ped-acoes">' + acoes + '</span></div>';
}
const btnAcao = (acao, u, txt, cls) => '<button type="button" class="mini ' + (cls || '') + '" data-acao="' + acao + '" data-u="' + esc(u) + '">' + txt + '</button>';

function renderPedidos() {
  $('box-pedidos').classList.toggle('oculto', !PED_REC.length);
  $('qtd-pedidos').textContent = PED_REC.length;
  $('lista-pedidos').innerHTML = PED_REC.map(p => cartaoPessoa(p, btnAcao('recusar', p.usuario, 'Recusar', 'perigo') + btnAcao('aceitar', p.usuario, 'Aceitar'))).join('');

  const box = $('lista-sug');
  if (!SQL_PED_OK) { box.innerHTML = '<p class="vazio-txt">Os pedidos ainda não estão ativos: rode o <b>banco_de_dado_aceitacao.txt</b> no SQL Editor do Supabase.</p>'; return; }
  if (!SUGESTOES.length) { box.innerHTML = '<p class="vazio-txt">Ninguém para sugerir agora.</p>'; return; }
  box.innerHTML = '<p class="sug-nota">A pessoa precisa aceitar o seu pedido antes de vocês conversarem.</p>' + SUGESTOES.map(p => {
    let acao;
    if (p.recebido) acao = btnAcao('aceitar', p.usuario, 'Aceitar');
    else if (p.enviado) acao = btnAcao('cancelar', p.usuario, 'Enviado · cancelar', 'sec');
    else acao = btnAcao('pedir', p.usuario, '+ Pedir');
    return cartaoPessoa(p, acao);
  }).join('');
}

async function responderPedido(u, aceitar) {
  const msg = aceitar ? 'Quer realmente aceitar @' + u + '?\n\nVocês vão passar a conversar e a partilhar atualizações.' : 'Recusar o pedido de @' + u + '?';
  if (!confirm(msg)) return;
  const { data, error } = await db.rpc('contato_responder', { p_usuario: u, p_aceitar: aceitar });
  if (error) return avisoAdd('Erro: ' + error.message, 'erro');
  if (data === 'ok') avisoAdd('@' + u + ' aceito! Agora vocês podem conversar.', 'ok');
  else if (data === 'recusado') avisoAdd('Pedido de @' + u + ' recusado.', 'ok');
  else if (data === 'nao_encontrado') avisoAdd('Esse pedido não existe mais.', 'erro');
  else avisoAdd('Não foi possível concluir (' + data + ').', 'erro');
  await Promise.all([carregarLista(), carregarPedidos(true)]);
}

async function cancelarPedido(u) {
  const { error } = await db.rpc('contato_cancelar', { p_usuario: u });
  if (error) return avisoAdd('Erro: ' + error.message, 'erro');
  avisoAdd('Pedido para @' + u + ' cancelado.', 'ok');
  await carregarPedidos(true);
}

function cliquePedido(e) {
  const b = e.target.closest('[data-acao]'); if (!b) return;
  const u = b.dataset.u;
  ({
    pedir: () => { b.disabled = true; solicitarPessoa(u); },
    aceitar: () => responderPedido(u, true),
    recusar: () => responderPedido(u, false),
    cancelar: () => cancelarPedido(u)
  }[b.dataset.acao] || (() => {}))();

$('box-pedidos').addEventListener('click', cliquePedido);
$('box-sug').addEventListener('click', cliquePedido);
$('box-sug').addEventListener('toggle', () => { if ($('box-sug').open) carregarPedidos(true); });

/* ---------- conversa ---------- */
function pessoaDe(u) { return PESSOAS.find(p => String(p.usuario).toLowerCase() === u) || null; }

async function abrirConversa(usuario) {
  const u = String(usuario).toLowerCase();
  let p = pessoaDe(u);
  if (!p) { await carregarLista(); p = pessoaDe(u); }
  if (!p) { avisoAdd('@' + u + ' não está na sua lista.', 'erro'); return; }

  atual = u; ULTIMO_ID = 0;
  $('shell').classList.add('em-conversa');
  $('conv-topo').classList.remove('oculto'); $('envio').classList.remove('oculto');
  $('conv-av').innerHTML = avatar(p); $('conv-nome').textContent = p.nome || p.usuario; $('conv-user').textContent = '@' + p.usuario;
  $('msgs').innerHTML = '<div class="conv-vazia">A carregar...</div>';
  renderLista();
  await carregarConversa(true);
  if (window.matchMedia('(pointer:fine)').matches) $('texto').focus();
}

function fecharConversa() {
  atual = null; ULTIMO_ID = 0;
  $('shell').classList.remove('em-conversa');
  $('conv-topo').classList.add('oculto'); $('envio').classList.add('oculto');
  $('msgs').innerHTML = '<div class="sem-selecao"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><p>Escolha uma pessoa para conversar.</p></div>';
  history.replaceState(null, '', 'chat.html');
  renderLista();
}

async function carregarConversa(forcarFim) {
  if (!atual) return;
  const alvo = atual;
  const { data, error } = await db.rpc('chat_conversa', { p_usuario: alvo, p_limite: 200 });
  if (alvo !== atual) return;
  if (error) { $('msgs').innerHTML = '<div class="conv-vazia">Não foi possível carregar a conversa.<br><small>' + esc(error.message) + '</small></div>'; return; }
  const lista = data || [], ult = lista.map(m => m.id).join(',');
  if (!forcarFim && ult === ULTIMO_ID) return;
  const box = $('msgs');
  const noFim = forcarFim || (box.scrollHeight - box.scrollTop - box.clientHeight < 140);
  ULTIMO_ID = ult;
  renderMensagens(lista);
  if (noFim) box.scrollTop = box.scrollHeight;
  if (lista.some(m => !m.de_mim)) {
    db.rpc('chat_marcar_lidas', { p_usuario: alvo }).then(() => carregarResumo(), () => {});
  }
}

function renderMensagens(lista) {
  const box = $('msgs');
  if (!lista.length) { box.innerHTML = '<div class="conv-vazia">Nenhuma mensagem ainda.<br>Diga olá!</div>'; return; }
  let h = '', ultimoDia = '';
  lista.forEach(m => {
    const dia = diaRotulo(m.criado_em);
    if (dia !== ultimoDia) { h += '<div class="dia-sep">' + esc(dia) + '</div>'; ultimoDia = dia; }
    h += '<div class="bolha ' + (m.de_mim ? 'minha' : 'outra') + '">' + conteudoMsg(m.texto) + '<time>' + hhmm(m.criado_em) + '</time>' +
      (m.de_mim ? '<div class="acoes-msg"><button type="button" class="btn-apagar-msg" data-apagar="' + m.id + '">Apagar</button></div>' : '') + '</div>';
  });
  box.innerHTML = h;
}

async function carregarResumo() {
  const { data } = await db.rpc('chat_resumo');
  RESUMO = {}; (data || []).forEach(x => { RESUMO[String(x.usuario).toLowerCase()] = x; });
  renderLista();
}

async function atualizarSilencioso() {
  if (document.visibilityState !== 'visible' || !uid) return;
  await carregarResumo();
  carregarPedidos(false);
  if (atual) carregarConversa(false);
  if (Date.now() - ultimoUso > 60000) carregarUso();
}

/* ---------- enviar ---------- */
const campo = $('texto');
function ajustarAltura() { campo.style.height = 'auto'; campo.style.height = Math.min(campo.scrollHeight, 130) + 'px'; }
campo.addEventListener('input', ajustarAltura);
campo.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer:fine)').matches) { e.preventDefault(); $('envio').requestSubmit(); }
});

$('envio').addEventListener('submit', async e => {
  e.preventDefault();
  const txt = campo.value.trim();
  if (!txt || !atual || enviando) return;
  enviando = true; $('btn-enviar').disabled = true;
  const alvo = atual;

  const box = $('msgs');
  const vazia = box.querySelector('.conv-vazia'); if (vazia) vazia.remove();
  const tmp = document.createElement('div');
  tmp.className = 'bolha minha enviando'; tmp.innerHTML = formatarMensagem(txt) + '<time>…</time>';
  box.appendChild(tmp); box.scrollTop = box.scrollHeight;
  campo.value = ''; ajustarAltura();

  const { data, error } = await db.rpc('chat_enviar', { p_usuario: alvo, p_texto: txt });
  enviando = false; $('btn-enviar').disabled = false;

  if (error || data !== 'ok') {
    tmp.remove();
    campo.value = txt; ajustarAltura();
    const motivo = error ? error.message : data === 'sem_permissao' ? 'Essa pessoa não está na sua lista.' : data === 'nao_encontrado' ? 'Utilizador não encontrado.' : 'Mensagem vazia.';
    alert('Não foi possível enviar: ' + motivo);
    return;
  }
  await carregarConversa(true);
  carregarResumo();
});

/* ---------- PDF, apagar e aviso de espaço ---------- */
const PDF_RE = /^\[pdf:(\d+)\]\s*(.*)$/;
const ICONE_PDF = '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>';
function conteudoMsg(texto) {
  const m = PDF_RE.exec(String(texto || ''));
  if (!m) return formatarMensagem(texto);
  return '<div class="arq" data-arq="' + m[1] + '" role="button" tabindex="0">' + ICONE_PDF +
    '<span class="arq-info"><span class="arq-nome">' + esc(m[2] || 'arquivo.pdf') + '</span><span class="arq-sub">PDF · toque para abrir</span></span></div>';
}
function resumoTexto(t) {
  const m = PDF_RE.exec(String(t || ''));
  return m ? 'PDF · ' + (m[2] || 'PDF') : String(t || '').replace(/\s+/g, ' ');
}
function fmtBytes(b) {
  b = +b || 0;
  if (b >= 1073741824) return (b / 1073741824).toFixed(2).replace('.', ',') + ' GB';
  if (b >= 1048576) return (b / 1048576).toFixed(b >= 104857600 ? 0 : 1).replace('.', ',') + ' MB';
  return Math.max(1, Math.round(b / 1024)) + ' KB';
}

/* toque na bolha: mostra "Apagar"; toque no PDF: abre */
$('msgs').addEventListener('click', e => {
  const ap = e.target.closest('[data-apagar]');
  if (ap) { apagarMensagem(+ap.dataset.apagar); return; }
  const arq = e.target.closest('[data-arq]');
  if (arq) { abrirPdf(+arq.dataset.arq, arq); return; }
  if (e.target.closest('a')) return;
  const b = e.target.closest('.bolha.minha');
  document.querySelectorAll('.bolha.sel').forEach(x => { if (x !== b) x.classList.remove('sel'); });
  if (b) b.classList.toggle('sel');
});
$('msgs').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-arq]')) { e.preventDefault(); abrirPdf(+e.target.dataset.arq, e.target); }
});

async function apagarMensagem(id) {
  if (!confirm('Apagar esta mensagem para os dois lados?\nSe for um PDF, o arquivo também é apagado.')) return;
  const { data, error } = await db.rpc('chat_apagar_mensagem', { p_id: id });
  if (error || (data !== 'ok' && data !== 'nao_encontrado')) { alert('Não foi possível apagar: ' + (error ? error.message : data)); return; }
  await carregarConversa(false);
  carregarResumo(); carregarUso();
}

$('btn-apagar-conv').addEventListener('click', async () => {
  if (!atual) return;
  const alvo = atual, p = pessoaDe(alvo), nome = p ? (p.nome || p.usuario) : '@' + alvo;
  if (!confirm('Apagar TODA a conversa com ' + nome + '?\nAs mensagens e os PDFs somem para os dois lados e não dá para desfazer.')) return;
  const { data, error } = await db.rpc('chat_apagar_conversa', { p_usuario: alvo });
  if (error || data !== 'ok') { alert('Não foi possível apagar a conversa: ' + (error ? error.message : data)); return; }
  if (alvo === atual) await carregarConversa(true);
  carregarResumo(); carregarUso();
});

/* enviar PDF */
function lerBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(r.error);
    r.readAsDataURL(file);
  });
}
$('btn-anexo').addEventListener('click', () => { if (atual && !enviando) $('arquivo').click(); });
$('arquivo').addEventListener('change', async () => {
  const f = $('arquivo').files[0];
  $('arquivo').value = '';
  if (!f || !atual || enviando) return;
  if (!(f.type === 'application/pdf' || /\.pdf$/i.test(f.name))) { alert('Só é possível enviar arquivos PDF.'); return; }
  if (f.size > 5 * 1024 * 1024) { alert('Este PDF tem ' + fmtBytes(f.size) + '. O limite é 5 MB.'); return; }

  enviando = true; $('btn-enviar').disabled = true; $('btn-anexo').disabled = true;
  const alvo = atual, box = $('msgs');
  const vazia = box.querySelector('.conv-vazia'); if (vazia) vazia.remove();
  const tmp = document.createElement('div');
  tmp.className = 'bolha minha enviando';
  tmp.innerHTML = '<div class="arq">' + ICONE_PDF + '<span class="arq-info"><span class="arq-nome">' + esc(f.name) + '</span><span class="arq-sub">A enviar...</span></span></div><time>…</time>';
  box.appendChild(tmp); box.scrollTop = box.scrollHeight;

  let erroMsg = '';
  try {
    const b64 = await lerBase64(f);
    const { data, error } = await db.rpc('chat_enviar_pdf', { p_usuario: alvo, p_nome: f.name, p_base64: b64 });
    if (error) erroMsg = /chat_enviar_pdf|PGRST202|does not exist/i.test(error.message) ? 'O envio de PDF ainda não foi ativado no banco (rode o SQL de atualização do chat).' : error.message;
    else if (data !== 'ok') erroMsg = ({ arquivo_grande: 'O PDF passa de 5 MB.', arquivo_invalido: 'O arquivo não é um PDF válido.', sem_permissao: 'Essa pessoa não está na sua lista.', nao_encontrado: 'Utilizador não encontrado.' })[data] || 'Erro ao enviar.';
  } catch (e) { erroMsg = 'Não foi possível ler o arquivo.'; }

  enviando = false; $('btn-enviar').disabled = false; $('btn-anexo').disabled = false;
  tmp.remove();
  if (erroMsg) { alert('Não foi possível enviar o PDF: ' + erroMsg); return; }
  if (alvo === atual) await carregarConversa(true);
  carregarResumo(); carregarUso();
});

/* abrir/baixar PDF */
async function abrirPdf(id, el) {
  if (el.classList.contains('carregando')) return;
  el.classList.add('carregando');
  try {
    const { data, error } = await db.rpc('chat_arquivo_obter', { p_id: id });
    if (error || !data || !data.base64) { alert('Não foi possível abrir o PDF. Ele pode ter sido apagado.'); return; }
    const bin = atob(data.base64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    const a = document.createElement('a');
    a.href = url; a.download = data.nome || 'arquivo.pdf'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) {
    alert('Não foi possível abrir o PDF.');
  } finally {
    el.classList.remove('carregando');
  }
}

/* uso do banco + aviso de 800 MB */
async function carregarUso() {
  ultimoUso = Date.now();
  const { data, error } = await db.rpc('chat_uso');
  if (error || !data) return;
  USO = data;
  renderAviso();
  if (!$('modal-limpar').classList.contains('oculto')) textoUsoModal();
}
function avisoAdiado() { try { return (+localStorage.getItem('fluxo_chat_aviso_ate') || 0) > Date.now(); } catch (e) { return false; } }
function renderAviso() {
  const box = $('aviso-espaco');
  if (!USO || +USO.chat_bytes < +USO.aviso_bytes || avisoAdiado()) { box.classList.add('oculto'); return; }
  box.innerHTML = '<b>O chat já ocupa ' + esc(fmtBytes(USO.chat_bytes)) + ' do banco de dados.</b> ' +
    'Passou do aviso de ' + esc(fmtBytes(USO.aviso_bytes)) + '. Apague mensagens e PDFs antigos para liberar espaço. ' +
    'Se o banco chegar a ' + esc(fmtBytes(USO.limite_bytes)) + ', o sistema apaga os mais antigos sozinho.' +
    '<div class="aviso-acoes"><button type="button" class="btn-peq perigo" data-aviso="limpar">Limpar chat</button>' +
    '<button type="button" class="btn-peq sec" data-aviso="manter">Manter por enquanto</button></div>';
  box.classList.remove('oculto');
}
$('aviso-espaco').addEventListener('click', e => {
  const b = e.target.closest('[data-aviso]'); if (!b) return;
  if (b.dataset.aviso === 'limpar') abrirLimpeza();
  else { try { localStorage.setItem('fluxo_chat_aviso_ate', String(Date.now() + 24 * 3600 * 1000)); } catch (x) {} renderAviso(); }
});

/* janela "Limpar chat" */
function textoUsoModal() {
  $('limpar-uso').textContent = USO
    ? 'O chat usa ' + fmtBytes(USO.chat_bytes) + ' (' + USO.mensagens + ' mensagens, ' + USO.pdfs + ' PDFs, ' + fmtBytes(USO.pdf_bytes) + ' em PDFs). Banco inteiro: ' + fmtBytes(USO.banco_bytes) + ' de ' + fmtBytes(USO.limite_bytes) + '.'
    : 'Escolha o que apagar para liberar espaço no banco.';
}
function abrirLimpeza() {
  $('limpar-res').textContent = ''; $('limpar-res').className = 'modal-res';
  textoUsoModal();
  $('modal-limpar').classList.remove('oculto');
  carregarUso();
}
function fecharLimpeza() { $('modal-limpar').classList.add('oculto'); }
$('btn-limpar-topo').addEventListener('click', abrirLimpeza);
$('limpar-cancelar').addEventListener('click', fecharLimpeza);
$('modal-limpar').addEventListener('click', e => { if (e.target === $('modal-limpar')) fecharLimpeza(); });
$('limpar-ok').addEventListener('click', async () => {
  const modo = $('limpar-modo').value, dias = +$('limpar-dias').value;
  const oQue = modo === 'pdfs' ? 'os PDFs' : 'as mensagens e os PDFs';
  const quando = dias ? ' com mais de ' + dias + ' dias' : '';
  if (!confirm('Apagar ' + oQue + quando + ' das suas conversas?\nIsso some para os dois lados e não dá para desfazer.')) return;
  const btn = $('limpar-ok'), res = $('limpar-res');
  btn.disabled = true;
  const { data, error } = await db.rpc('chat_limpar', { p_modo: modo, p_dias: dias });
  btn.disabled = false;
  if (error || !data || data.erro) { res.className = 'modal-res erro'; res.textContent = 'Erro: ' + (error ? error.message : (data && data.erro) || 'tente de novo'); return; }
  const n = data.apagadas || 0;
  res.className = 'modal-res';
  res.textContent = n ? n + (n === 1 ? ' item apagado.' : ' itens apagados.') : 'Nada para apagar com esse filtro.';
  await carregarUso();
  carregarResumo();
  if (atual) carregarConversa(true);
});

/* ---------- tempo real ---------- */
function ligarTempoReal() {
  try {
    canal = db.channel('chat-' + uid)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_mensagens', filter: 'para=eq.' + uid }, () => {
        carregarResumo();
        if (atual) carregarConversa(false);
      })
      .subscribe();
  } catch (e) {}
}
window.addEventListener('beforeunload', () => { clearInterval(tPoll); try { if (canal) db.removeChannel(canal); } catch (e) {} });
</script>
